<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#E7F0F5">
<title>CATATAN PRESENSI SISWA SISWI — Gerbang Pintar Modernisasi Sistem Administrasi</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<!-- [OPTIMASI LOADING] qrcode.js & jsQR TETAP dimuat di sini (defer) karena
     keduanya inti dari FUNGSI PEMINDAIAN — dibutuhkan sejak aplikasi pertama
     kali dibuka. XLSX (~700KB+) dan JSZip SENGAJA TIDAK dimuat di sini lagi —
     keduanya hanya dipakai fitur Admin yang jarang dipakai (impor Excel,
     unduh kartu/QR massal dalam ZIP), jadi dimuat belakangan hanya saat
     benar-benar dibutuhkan (lihat loadScriptOnce() & pemanggilannya di
     handleImportFile/downloadAllQr/downloadAllQrOnly). Ini membebaskan
     bandwidth di awal sepenuhnya untuk qrcode.js+jsQR, sehingga fungsi
     pemindaian siap lebih cepat setiap kali aplikasi dibuka. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"></noscript>
<style>
:root{
  --cream:#E7F0F5;
  --panel:#F3F9FC;
  --panel-hi:#FFFFFF;
  --well:#E0EDF4;
  --ink:#0A2540;
  --on-accent:#F2F9FC;
  --line:rgba(15,49,74,0.14);
  --line-strong:rgba(15,49,74,0.26);
  --gold:#0F5C8C;
  --gold-dim:#0B4468;
  --green:#1B8A8A;
  --green-dim:#136666;
  --rust:#C0604B;
  --rust-dim:#8F4635;
  --text:#122A3D;
  --text-dim:#4E6B80;
  --text-faint:#8098AA;
  --radius:14px;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:
    radial-gradient(1100px 600px at 15% -10%, rgba(15,92,140,0.10), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(27,138,138,0.08), transparent 55%),
    var(--cream);
  color:var(--text);
  font-family:'Inter',sans-serif;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  font-size:17.5px;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  overscroll-behavior:none;
}
.mono{font-family:'JetBrains Mono',monospace;}
.display{font-family:'Space Grotesk',sans-serif;}
#app{height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden;}

/* ===== top bar ===== */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:9px 20px; padding-top:calc(9px + env(safe-area-inset-top));
  padding-left:calc(20px + env(safe-area-inset-left));
  padding-right:calc(20px + env(safe-area-inset-right));
  border-bottom:1px solid var(--line);
  background:rgba(247,241,224,0.72); backdrop-filter:blur(6px);
  flex-shrink:0;
}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{
  width:90px; height:90px; border-radius:50%;
  background:#fff;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 10px rgba(15,92,140,0.22);
  flex-shrink:0; padding:2px;
}
.brand-mark img{width:100%; height:100%; object-fit:contain; border-radius:50%;}
.brand-mark svg{width:19px; height:19px;}
.brand-text .name{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19.5px; letter-spacing:0.2px; line-height:1.15; max-width:230px;}
.brand-text .sub{font-size:15.62px; color:var(--text-dim); letter-spacing:0.2px; line-height:1.2;}
.topbar-right{display:flex; align-items:center; gap:10px;}
.server-status{display:flex; align-items:center; gap:6px; font-size:13.12px; font-weight:500; padding:5px 10px; border-radius:20px; border:1px solid var(--line-strong); background:var(--panel); flex-shrink:0; cursor:default;}
.server-status .dot{width:7px; height:7px; border-radius:50%; background:var(--text-faint); flex-shrink:0;}
.server-status.on{color:#1E9E8C; border-color:rgba(30,158,140,0.35); background:rgba(30,158,140,0.08);}
.server-status.on .dot{background:#1E9E8C; box-shadow:0 0 0 3px rgba(30,158,140,0.2); animation:pulse 2s infinite;}
.server-status.off{color:var(--rust); border-color:rgba(192,96,75,0.3); background:rgba(192,96,75,0.06);}
.server-status.off .dot{background:var(--rust);}
.server-status.checking .dot{background:var(--text-faint); animation:pulse 1s infinite;}
.server-status{cursor:pointer;}
.server-status.retry{color:#9A6B12; border-color:rgba(217,164,65,0.4); background:rgba(217,164,65,0.10);}
.server-status.retry .dot{background:#D9A441; animation:pulse 1s infinite;}
.clock{font-family:'JetBrains Mono',monospace; font-size:13.75px; color:var(--text-dim); text-align:right; line-height:1.2;}
.clock b{color:var(--text); display:block; font-size:15px;}
.btn-ghost{
  background:transparent; border:1px solid var(--line-strong); color:var(--text-dim);
  padding:6px 12px; border-radius:8px; font-size:15px; cursor:pointer; font-family:'Inter';
  transition:all .15s ease;
}
.btn-ghost:hover{border-color:var(--gold); color:var(--text); background:rgba(15,92,140,0.06);}

main{flex:1; display:flex; flex-direction:column; min-height:0; overflow:hidden;}

/* ===== LANDING ===== */
.landing{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:14px 24px; position:relative; min-height:0;
}
.landing-eyebrow{
  font-family:'JetBrains Mono',monospace; font-size:13.12px; letter-spacing:2px;
  color:var(--gold); text-transform:uppercase; margin-bottom:10px; display:flex; align-items:center; gap:8px;
}
.landing-eyebrow .dot{width:5px; height:5px; border-radius:50%; background:var(--green); box-shadow:0 0 0 3px rgba(27,138,138,0.18); animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.4;}}
.landing h1{
  font-family:'Space Grotesk',sans-serif; font-weight:700;
  font-size:clamp(25px,3.25vw,35px); text-align:center; line-height:1.14; letter-spacing:-0.3px;
  max-width:640px;
}
.landing h1 span{color:var(--gold);}
.landing p.lead{
  color:var(--text-dim); font-size:15.62px; max-width:460px; text-align:center; margin-top:10px; line-height:1.5;
}

.gate-select{
  display:grid; grid-template-columns:1fr 1fr; gap:12px;
  max-width:510px; width:100%; margin-top:22px;
  position:relative;
}
.gate-select::before{
  content:''; position:absolute; left:50%; top:-12px; bottom:-12px; width:1px;
  background:linear-gradient(var(--line), var(--line-strong), var(--line));
  transform:translateX(-50%);
}
.gate-card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px; cursor:pointer; text-align:left; position:relative; overflow:hidden;
  transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.gate-card:hover{transform:translateY(-3px); border-color:var(--line-strong); box-shadow:0 14px 30px rgba(60,50,20,0.16);}
.gate-card .gate-num{
  font-family:'JetBrains Mono',monospace; font-size:9.38px; color:var(--text-faint);
  letter-spacing:1.5px; text-transform:uppercase; margin-bottom:6px; display:block;
}
.gate-card .gate-icon{
  width:27px; height:27px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  margin-bottom:8px;
}
.gate-card.admin .gate-icon{background:rgba(15,92,140,0.12); border:1px solid rgba(15,92,140,0.3);}
.gate-card.petugas .gate-icon{background:rgba(27,138,138,0.12); border:1px solid rgba(27,138,138,0.3);}
.gate-card .gate-icon svg{width:14px; height:14px;}
.gate-card h3{font-family:'Space Grotesk',sans-serif; font-size:14.53px; font-weight:600; margin-bottom:3px;}
.gate-card p{font-size:10.79px; color:var(--text-dim); line-height:1.4; margin-bottom:8px;}
.gate-card .gate-enter{
  display:inline-flex; align-items:center; gap:5px; font-size:10.79px; font-weight:600;
  color:var(--text);
}
.gate-card.admin .gate-enter{color:var(--gold);}
.gate-card.petugas .gate-enter{color:var(--green);}
.gate-card .gate-enter svg{width:9px; height:9px; transition:transform .15s ease;}
.gate-card:hover .gate-enter svg{transform:translateX(3px);}

.landing-stats{
  display:flex; gap:26px; margin-top:22px; padding-top:14px; border-top:1px solid var(--line);
  max-width:680px; width:100%; justify-content:center;
}
.stat{text-align:center;}
.stat .n{font-family:'Space Grotesk',sans-serif; font-size:23.75px; font-weight:700; color:var(--gold);}
.stat .l{font-size:11.88px; color:var(--text-faint); letter-spacing:0.3px; margin-top:1px;}
.landing-copyright{margin-top:24px; padding-bottom:6px; font-size:12.5px; color:var(--text-faint); text-align:center;}

/* ===== shared screen shell ===== */
.screen{flex:1; display:flex; flex-direction:column; min-height:0; overflow:hidden;}
.screen-header{
  padding:11px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  flex-shrink:0;
}
.screen-header .back{
  display:flex; align-items:center; gap:7px; color:var(--text-dim); font-size:15px; cursor:pointer; background:none; border:none; font-family:'Inter';
}
.screen-header .back:hover{color:var(--text);}
.screen-header .back svg{width:13px; height:13px;}
.screen-title{font-family:'Space Grotesk',sans-serif; font-size:18.75px; font-weight:600;}
.screen-title .tag{
  font-family:'JetBrains Mono',monospace; font-size:11.88px; color:var(--on-accent); background:var(--gold);
  padding:2px 7px; border-radius:5px; margin-left:8px; vertical-align:middle; font-weight:600;
}
.screen-body{flex:1; padding:14px 20px 16px; max-width:1200px; width:100%; margin:0 auto; overflow-y:auto; min-height:0; -webkit-overflow-scrolling:touch;
  padding-left:calc(20px + env(safe-area-inset-left)); padding-right:calc(20px + env(safe-area-inset-right));
  padding-bottom:calc(16px + env(safe-area-inset-bottom));
}

/* ===== admin login ===== */
.login-wrap{flex:1; display:flex; align-items:center; justify-content:center; padding:16px 20px; min-height:0;}
.login-card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:22px 24px; width:100%; max-width:300px; text-align:center;
}
.login-card .lock{
  width:36px; height:36px; margin:0 auto 10px; border-radius:10px; background:rgba(15,92,140,0.12);
  border:1px solid rgba(15,92,140,0.3); display:flex; align-items:center; justify-content:center;
}
.login-card .lock svg{width:17px; height:17px;}
.login-card h3{font-family:'Space Grotesk',sans-serif; font-size:18.75px; margin-bottom:4px;}
.login-card p{font-size:14.38px; color:var(--text-dim); margin-bottom:14px;}
.pin-input{
  width:100%; background:var(--well); border:1px solid var(--line-strong); border-radius:8px;
  padding:9px; text-align:center; font-family:'JetBrains Mono',monospace; font-size:20px; letter-spacing:7px;
  color:var(--text); margin-bottom:10px;
}
.pin-input:focus{outline:none; border-color:var(--gold);}
.hint{font-size:13.12px; color:var(--text-faint); margin-bottom:12px;}
.err-msg{color:var(--rust); font-size:14.38px; margin-bottom:8px; min-height:14px;}

/* ===== buttons ===== */
.btn{
  border:none; border-radius:9px; padding:9px 16px; font-size:15.62px; font-weight:600; cursor:pointer;
  font-family:'Inter'; display:inline-flex; align-items:center; justify-content:center; gap:7px;
  transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
}
.btn:active{transform:scale(0.97);}
.btn-gold{background:linear-gradient(155deg,var(--gold),var(--gold-dim)); color:var(--on-accent); box-shadow:0 5px 14px rgba(15,92,140,0.22);}
.btn-green{background:linear-gradient(155deg,var(--green),var(--green-dim)); color:var(--gold-dim); box-shadow:0 5px 14px rgba(27,138,138,0.22);}
.btn-rust{background:linear-gradient(155deg,var(--rust),var(--rust-dim)); color:#fff; box-shadow:0 5px 14px rgba(192,96,75,0.28);}
.btn-block{width:100%;}
.btn:disabled{opacity:0.45; cursor:not-allowed;}
.btn-sm{padding:7px 11px; font-size:14.38px; border-radius:7px;}
.btn-outline{background:transparent; border:1px solid var(--line-strong); color:var(--text);}
.btn-outline:hover{border-color:var(--gold);}

/* ===== tabs ===== */
.tabs{display:flex; gap:6px; margin-bottom:12px; border-bottom:1px solid var(--line);}
.tab{
  padding:8px 4px; margin-right:18px; font-size:15.62px; color:var(--text-dim); cursor:pointer;
  border-bottom:2px solid transparent; font-weight:500; background:none; border-top:none; border-left:none; border-right:none; font-family:'Inter';
}
.tab.active{color:var(--gold); border-bottom-color:var(--gold);}

/* ===== cards / tables ===== */
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;}
.panel + .panel{margin-top:12px;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.field label{display:block; font-size:13.75px; color:var(--text-dim); margin-bottom:4px;}
.field input, .field select{
  width:100%; background:var(--well); border:1px solid var(--line-strong); border-radius:7px;
  padding:8px 10px; color:var(--text); font-size:15.62px; font-family:'Inter';
}
.field input:focus, .field select:focus{outline:none; border-color:var(--gold);}
.field{margin-bottom:9px;}

.stu-list{display:flex; flex-direction:column; gap:7px; margin-top:4px; max-height:220px; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.stu-row{
  display:flex; align-items:center; gap:11px; padding:9px 11px; background:var(--well);
  border:1px solid var(--line); border-radius:9px;
}
.stu-avatar{
  width:30px; height:30px; border-radius:8px; background:var(--panel-hi); border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14.38px; color:var(--gold); flex-shrink:0;
}
.stu-info{flex:1; min-width:0;}
.stu-info .nm{font-size:15.62px; font-weight:600;}
.stu-info .meta{font-size:13.12px; color:var(--text-dim); margin-top:1px;}
.stu-info .meta .code{font-family:'JetBrains Mono',monospace; color:var(--text-faint);}
.stu-actions{display:flex; gap:6px; flex-shrink:0;}
.icon-btn{
  width:27px; height:27px; border-radius:7px; border:1px solid var(--line-strong); background:transparent;
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-dim);
}
.icon-btn:hover{border-color:var(--gold); color:var(--gold);}
.icon-btn svg{width:13px; height:13px;}

.empty{text-align:center; padding:22px 16px; color:var(--text-faint);}
.empty svg{width:26px; height:26px; margin-bottom:8px; opacity:0.5;}
.empty p{font-size:15px;}

/* qr modal */
.overlay{
  position:fixed; inset:0; background:rgba(10,16,28,0.72); backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
}
.qr-modal{
  background:var(--panel); border:1px solid var(--line-strong); border-radius:var(--radius);
  padding:18px; max-width:380px; width:100%; text-align:center;
}
/* Kartu presensi mode potret, tetap seukuran KTP Indonesia (ID-1) tapi
   diputar: 53.98mm x 85.6mm. Satuan mm dipakai langsung di CSS agar
   ukuran tetap akurat saat dicetak 1:1. */
.id-card{
  width:53.98mm; height:85.6mm; box-sizing:border-box;
  background:linear-gradient(160deg, #0D3A5C, #061A2B); border:1px solid var(--gold-dim); border-radius:3mm;
  padding:3.2mm; margin:0 auto 12px; display:flex; flex-direction:column; align-items:center; text-align:center;
}
.id-card .id-head{display:flex; flex-direction:column; align-items:center; gap:0.8mm; margin-bottom:1.8mm;}
.id-card .id-head img{width:14mm; height:14mm; object-fit:contain;}
.id-card .school{font-size:11.6px; letter-spacing:0.5px; color:#FFFFFF; text-transform:uppercase; font-family:'JetBrains Mono'; line-height:1.25;}
.id-card .id-body{display:flex; flex-direction:column; align-items:center; flex:1; min-height:0; width:100%;}
/* Foto: ukuran TETAP 25mm x 30mm (bukan lagi mengisi sisa ruang) — nama
   siswa digambar tepat di bawahnya (.nm), sedangkan kelas & kode dipindah
   ke ".bottom-row" di sebelah kiri kode QR. */
.id-card .photo-slot{
  width:25mm; height:30mm; flex-shrink:0; border-radius:1.6mm; overflow:hidden;
  background:rgba(255,255,255,0.08); border:1px dashed rgba(175,203,219,0.55);
  display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative;
}
.id-card .photo-slot img{width:100%; height:100%; object-fit:cover;}
.id-card .photo-slot .photo-hint{font-size:6px; color:#AFCBDB; text-align:center; padding:0 1mm; line-height:1.3;}
/* Nama siswa: TEPAT di bawah foto, rata tengah. */
.id-card .nm{width:100%; margin-top:1.8mm; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:10.55px; color:#EAF4FA; line-height:1.25; word-break:break-word; text-align:center;}
/* Baris bawah kartu: kelas & kode + kotak QR SEKARANG ditampilkan sebagai
   SATU KELOMPOK yang dipusatkan (bukan lagi rata kiri-kanan penuh) —
   didorong ke dasar kartu (margin-top:auto) memakai sisa ruang yang tidak
   terpakai oleh foto+nama di atasnya. */
.id-card .bottom-row{width:100%; margin-top:auto; margin-bottom:3mm; flex-shrink:0; display:flex; align-items:center; justify-content:center; gap:3mm;}
.id-card .id-info{display:flex; flex-direction:column; align-items:flex-start; text-align:left; min-width:0; flex:0 0 auto;}
.id-card .cls{font-size:7px; color:#AFCBDB;}
.id-card .code{font-family:'JetBrains Mono',monospace; font-size:6px; color:rgba(225,230,240,0.6); margin-top:1.2mm;}
/* Kotak QR: ukuran tidak berubah (18mm, isi QR 16mm). */
.id-card .qr-box{width:18mm; height:18mm; box-sizing:border-box; background:#fff; padding:1mm; border-radius:1.2mm; flex-shrink:0; line-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden;}
.id-card .qr-box canvas{width:16mm !important; height:16mm !important; max-width:none !important; max-height:none !important;}
.modal-actions{display:flex; gap:8px; flex-wrap:wrap;}

/* cetak kartu presensi: saat mencetak, sembunyikan seluruh halaman
   kecuali kartu id-card di dalam modal QR, supaya kertas yang keluar
   hanya berisi kartu siap gunting/laminating, seukuran KTP asli. */
@media print{
  body *{ visibility:hidden; }
  #qrOverlay, #qrOverlay *{ visibility:visible; }
  #qrOverlay{ position:absolute; inset:auto; top:0; left:0; width:100%; height:auto; background:#fff !important; backdrop-filter:none; padding:24px; display:block; }
  .qr-modal{ box-shadow:none; border:none; background:#fff; max-width:none; margin:0 auto; padding:0; }
  .id-card{ margin:0 auto; }
  .modal-actions{ display:none !important; }
  .photo-slot .photo-hint{ display:none; }
}

/* riwayat table */
.log-list{max-height:280px; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.log-row{
  display:grid; grid-template-columns:60px 1fr 80px 95px 1fr; gap:10px; align-items:center;
  padding:8px 10px; border-bottom:1px solid var(--line); font-size:14.38px;
}
.log-row.head{color:var(--text-faint); font-size:11.88px; text-transform:uppercase; letter-spacing:0.5px; font-family:'JetBrains Mono';}
.log-time{font-family:'JetBrains Mono',monospace; color:var(--text-dim); font-size:13.75px;}
.pill{display:inline-flex; align-items:center; padding:2px 8px; border-radius:20px; font-size:12.5px; font-weight:600;}
.pill.masuk{background:rgba(27,138,138,0.15); color:var(--green);}
.pill.pulang{background:rgba(15,92,140,0.15); color:var(--gold);}
.pill.manual{background:rgba(192,96,75,0.15); color:var(--rust);}
.pill.tidakHadir{background:rgba(192,96,75,0.15); color:var(--rust);}
.pill.ket-Hadir{background:rgba(27,138,138,0.12); color:var(--green);}
.pill.ket-Sakit{background:rgba(91,123,150,0.16); color:#5B7B96;}
.pill.ket-Ijin{background:rgba(122,92,150,0.15); color:#7A5C96;}
.pill.ket-Alpa, .pill.ket-Bolos{background:rgba(192,96,75,0.15); color:var(--rust);}
.pill.ket-Emergency{background:rgba(192,96,75,0.28); color:#8A3420;}
.pill.ket-Lainnya{background:rgba(27,42,61,0.08); color:var(--text-dim);}
.wa-tag{font-size:14.38px; color:var(--text-faint); display:flex; align-items:center; gap:5px;}
.wa-tag svg{width:12px; height:12px;}

/* ===== petugas: mode select ===== */
.mode-select{
  display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; max-width:760px; margin:18px auto 0;
}
.mode-card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 14px; text-align:center; cursor:pointer; transition:all .18s ease;
}
.mode-card:hover{transform:translateY(-3px); border-color:var(--line-strong);}
.mode-card .m-icon{width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 10px;}
.mode-card.masuk .m-icon{background:rgba(27,138,138,0.12); border:1px solid rgba(27,138,138,0.3);}
.mode-card.pulang .m-icon{background:rgba(15,92,140,0.12); border:1px solid rgba(15,92,140,0.3);}
.mode-card.manual .m-icon{background:rgba(192,96,75,0.12); border:1px solid rgba(192,96,75,0.3);}
.mode-card.alpa .m-icon{background:rgba(192,96,75,0.12); border:1px solid rgba(192,96,75,0.3);}
.mode-card .m-icon svg{width:19px; height:19px;}
.mode-card h4{font-family:'Space Grotesk',sans-serif; font-size:17.5px; margin-bottom:4px;}
.mode-card p{font-size:13.75px; color:var(--text-dim);}
.mode-card .m-badge{
  display:inline-block; margin-top:8px; font-family:'JetBrains Mono',monospace; font-size:11.25px; letter-spacing:0.6px;
  color:var(--text-faint); border:1px solid var(--line-strong); border-radius:20px; padding:2px 8px; text-transform:uppercase;
}

/* ===== petugas: scan screen ===== */
.scan-layout{display:grid; grid-template-columns:1fr 300px; gap:16px; align-items:start;}
@media (max-width:860px){.scan-layout{grid-template-columns:1fr;}}

.scan-panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; text-align:center;}
.cam-frame{
  position:relative; width:100%; aspect-ratio:1/1; max-width:380px; margin:0 auto;
  background:var(--ink); border-radius:12px; overflow:hidden; border:1px solid var(--line-strong);
}
.cam-frame video{width:100%; height:100%; object-fit:cover;}
.cam-frame .brackets{position:absolute; inset:32px; pointer-events:none;}
.cam-frame .brackets::before, .cam-frame .brackets::after{content:''; position:absolute; width:40px; height:40px; border:5px solid var(--gold);}
.cam-frame .brackets::before{top:0; left:0; border-right:none; border-bottom:none; border-radius:10px 0 0 0;}
.cam-frame .brackets::after{bottom:0; right:0; border-left:none; border-top:none; border-radius:0 0 10px 0;}
.cam-frame .bracket-tr{position:absolute; top:32px; right:32px; width:40px; height:40px; border:5px solid var(--gold); border-left:none; border-bottom:none; border-radius:0 10px 0 0;}
.cam-frame .bracket-bl{position:absolute; bottom:32px; left:32px; width:40px; height:40px; border:5px solid var(--gold); border-right:none; border-top:none; border-radius:0 0 0 10px;}
.cam-frame .scanline{
  position:absolute; left:32px; right:32px; height:3px; background:linear-gradient(90deg,transparent,var(--green),transparent);
  animation:scan 2.2s ease-in-out infinite; top:32px;
}
@keyframes scan{0%{top:32px;} 50%{top:calc(100% - 32px);} 100%{top:32px;}}
.cam-frame .cam-off{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; color:var(--text-faint);
}
.cam-frame .cam-off svg{width:48px; height:48px;}
.cam-hint{font-size:13.12px; color:var(--text-dim); margin-top:8px;}
.divider-or{display:flex; align-items:center; gap:10px; margin:12px 0; color:var(--text-faint); font-size:12.5px; letter-spacing:0.8px;}
.divider-or::before,.divider-or::after{content:''; flex:1; height:1px; background:var(--line);}

/* Notifikasi tulisan (toast) untuk pemindaian gagal/ditolak — tampil melayang di
   atas layar, terlihat jelas baik saat memindai lewat kamera maupun input manual. */
.global-toast{
  position:fixed; left:50%; top:calc(env(safe-area-inset-top, 0px) + 14px); z-index:99999; max-width:92vw;
  padding:11px 18px; border-radius:11px; font-size:14.38px; font-weight:600; line-height:1.35;
  text-align:center; color:#fff; box-shadow:0 8px 22px rgba(0,0,0,0.28);
  opacity:0; pointer-events:none; transform:translate(-50%,-16px);
  transition:opacity .22s ease, transform .22s ease;
}
.global-toast.show{opacity:1; transform:translate(-50%,0);}
.global-toast.err{background:#B3261E;}
.global-toast.warn{background:#9A6B08;}
.global-toast.ok{background:#1E8E5A; font-size:16.5px; font-weight:700; padding:14px 22px; border:2px solid rgba(255,255,255,0.55); box-shadow:0 10px 28px rgba(30,142,90,0.45);}

.search-box{position:relative; margin-bottom:8px;}
.search-results{max-height:130px; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; gap:6px;}
.search-item{
  display:flex; align-items:center; gap:10px; padding:7px; background:var(--well); border:1px solid var(--line);
  border-radius:8px; cursor:pointer; text-align:left;
}
.search-item:hover{border-color:var(--gold);}

.ket-slot{
  display:flex; flex-direction:column; gap:3px; padding:9px 10px; background:var(--well); border:1px solid var(--line-strong);
  border-radius:9px; cursor:pointer; text-align:left; width:100%; font-family:'Inter';
}
.ket-slot:hover{border-color:var(--gold);}
.ket-slot-label{font-size:15.62px; font-weight:600; color:var(--text); display:flex; align-items:center;}
.ket-slot-info{font-size:13.75px; color:var(--text-dim);}
.ket-slot.ket-slot-empty{cursor:default; opacity:0.6;}
.ket-slot.ket-slot-empty:hover{border-color:var(--line-strong);}
.ket-slot.ket-slot-empty .ket-slot-info{color:var(--text-faint);}

.side-panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; max-height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.side-panel h4{font-family:'Space Grotesk',sans-serif; font-size:15.62px; margin-bottom:10px; display:flex; align-items:center; gap:6px;}
.selected-stu{
  display:flex; align-items:center; gap:10px; padding:10px; background:var(--well); border-radius:9px; margin-bottom:12px; border:1px solid var(--line-strong);
}
.selected-stu .stu-avatar{width:34px; height:34px; font-size:15.62px;}
.ket-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:10px;}
.ket-opt{
  padding:7px 6px; border-radius:8px; border:1px solid var(--line-strong); background:var(--well);
  font-size:13.75px; text-align:center; cursor:pointer; color:var(--text-dim); font-weight:500;
}
.ket-opt.active{border-color:var(--green); color:var(--green); background:rgba(27,138,138,0.14); font-weight:700;}
.ket-opt-add{border-style:dashed;}
.ket-opt-add::before{content:'+ '; }
.ket-opt-add.active::before{content:'✓ '; }
.side-panel .placeholder{text-align:center; padding:16px 8px; color:var(--text-faint); font-size:14.38px;}

.result-card{text-align:center; padding:4px 2px;}
.result-icon{width:42px; height:42px; border-radius:50%; margin:0 auto 10px; display:flex; align-items:center; justify-content:center;}
.result-icon.ok{background:rgba(27,138,138,0.15); border:2px solid var(--green);}
.result-icon svg{width:20px; height:20px;}
.result-card h3{font-family:'Space Grotesk',sans-serif; font-size:18.12px; margin-bottom:3px;}
.result-card p{font-size:13.75px; color:var(--text-dim); margin-bottom:10px;}
.wa-preview{
  background:var(--well); border:1px solid var(--line); border-radius:9px; padding:9px; text-align:left;
  font-size:13.12px; color:var(--text-dim); margin-bottom:10px; line-height:1.45; white-space:pre-wrap; max-height:120px; overflow-y:auto;
}
.wa-preview b{color:var(--text);}

::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:6px;}

/* ===== TABLET (layar sedang, sebelum turun ke mode HP) ===== */
@media (max-width:760px) and (min-width:641px){
  .mode-select{grid-template-columns:repeat(2, 1fr); max-width:520px;}
}

.landing{overflow-y:auto; -webkit-overflow-scrolling:touch;}
.login-wrap{overflow-y:auto; -webkit-overflow-scrolling:touch;}

/* ===== MOBILE / PORTRAIT (Android & iPhone) ===== */
@media (max-width:640px){
  html{ -webkit-text-size-adjust:100%; }
  .topbar{padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top)); padding-left:calc(14px + env(safe-area-inset-left)); padding-right:calc(14px + env(safe-area-inset-right));}
  .brand-mark{width:72px; height:72px;}
  .brand-text .name{font-size:16.38px; max-width:150px; line-height:1.1;}
  .brand-text .sub{font-size:13.25px;}
  .clock{display:none;}
  .server-status{padding:5px; gap:0;}
  .server-status .label{display:none;}
  .btn-ghost{padding:6px 10px; font-size:13.75px;}

  .landing{padding:10px 16px; padding-left:calc(16px + env(safe-area-inset-left)); padding-right:calc(16px + env(safe-area-inset-right));}
  .landing-eyebrow{font-size:11.88px; margin-bottom:8px;}
  .landing h1{font-size:23.75px; max-width:340px; line-height:1.18;}
  .landing p.lead{font-size:14.38px; margin-top:8px; max-width:320px;}

  .gate-select{grid-template-columns:1fr; gap:8px; margin-top:12px; max-width:255px;}
  .gate-select::before{display:none;}
  .gate-card{padding:10px; display:flex; align-items:center; gap:9px; text-align:left;}
  .gate-card .gate-icon{margin-bottom:0; width:26px; height:26px; flex-shrink:0;}
  .gate-card .gate-num{display:none;}
  .gate-card h3{font-size:13.13px; margin-bottom:2px;}
  .gate-card p{display:none;}
  .gate-card .gate-enter{font-size:10.31px; margin-top:2px;}
  .gate-card > div:not(.gate-icon){flex:1; min-width:0;}
  .gate-text{display:flex; flex-direction:column;}

  .landing-stats{margin-top:14px; padding-top:10px; gap:18px; max-width:340px;}
  .stat .n{font-size:20px;}
  .stat .l{font-size:10.62px;}

  .screen-header{padding:9px 14px; padding-left:calc(14px + env(safe-area-inset-left)); padding-right:calc(14px + env(safe-area-inset-right));}
  .screen-title{font-size:16.88px;}
  .screen-body{padding:10px 14px 14px; padding-left:calc(14px + env(safe-area-inset-left)); padding-right:calc(14px + env(safe-area-inset-right)); padding-bottom:calc(14px + env(safe-area-inset-bottom));}

  .grid-2{grid-template-columns:1fr;}
  .mode-select{grid-template-columns:1fr; max-width:320px; gap:10px;}
  .mode-card{display:flex; align-items:center; gap:12px; text-align:left; padding:13px 14px;}
  .mode-card .m-icon{margin:0; flex-shrink:0;}
  .mode-text{display:flex; flex-direction:column;}

  .scan-layout{grid-template-columns:1fr; gap:12px;}
  .cam-frame{max-width:300px;}
  .side-panel{max-height:none;}

  .log-row{grid-template-columns:44px 1fr 54px 58px; gap:5px; font-size:12.5px; padding:7px 8px;}
  .log-row > div:nth-child(5){display:none;}
  .pill{padding:2px 6px; font-size:11.25px;}

  /* prevent iOS auto-zoom on focus: inputs need >=16px */
  input, select{font-size:20px !important;}

  .btn{min-height:40px;}
  .icon-btn, .ket-opt, .gate-card, .mode-card, .search-item{min-height:36px;}
}

@media (max-width:360px){
  .landing h1{font-size:21.25px;}
  .gate-card h3{font-size:16.25px;}
}

.footer-note{
  text-align:center; padding:8px 16px; font-size:12.5px; color:var(--text-faint); border-top:1px solid var(--line);
  flex-shrink:0; padding-bottom:calc(8px + env(safe-area-inset-bottom));
}

/* ===== initial loading state (sebelum JS selesai memuat data) ===== */
.boot-loading{
  height:100vh; height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:12px; color:var(--text-dim); font-family:'Inter',sans-serif;
}
.boot-loading .spin{
  width:34px; height:34px; border-radius:50%; border:3px solid var(--line-strong); border-top-color:var(--gold);
  animation:boot-spin .8s linear infinite;
}
@keyframes boot-spin{ to{ transform:rotate(360deg); } }
.boot-loading span{font-size:14.38px;}
</style>
</head>

/* ================= KONFIGURASI SERVER ================= */
// Isi dengan URL Web App hasil Deploy dari Code.gs (diakhiri /exec), dan
// password (API_PASSWORD) yang sama dengan yang ditulis di Code.gs.
// Selama dua nilai ini kosong, verifikasi PIN akan menampilkan pesan
// "server belum terhubung" alih-alih diam-diam menerima PIN apa pun.
const API_URL = 'https://script.google.com/macros/s/AKfycby_yAaXpsOLvQucrpfhHrl7_TVMbUzaAtg9v4ZVlF5wk0nWFum6uv2-_5Qq3mSjspvA/exec';
const API_KEY = 'SMA04T'; // samakan dengan API_PASSWORD di Code.gs

async function callApi(payload){
  if(!API_URL){ throw new Error('SERVER_BELUM_DIKONFIGURASI'); }
  let json;
  try{
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' }, // hindari CORS preflight Apps Script
      credentials:'omit',
      body: JSON.stringify({ ...payload, key: API_KEY })
    });
    json = await res.json();
  }catch(netErr){
    // Gagal jaringan/timeout: minta pemeriksaan ulang lampu indikator sebentar lagi.
    scheduleServerCheck(1500);
    throw netErr;
  }
  // Server membalas JSON valid = server terjangkau (kecuali kunci API salah).
  if(json && !(json.ok === false && /api key/i.test(String(json.error||'')))){ markServerConnected(); }
  if(!json.ok){
    const err = new Error(json.error || 'Permintaan ditolak server.');
    // Tandai error ini sebagai penolakan DUPLIKAT (bukan sekadar gagal jaringan)
    // supaya pemanggil (tickScan/confirmManualAttendance) bisa menampilkan
    // notifikasi yang tepat — bukan menganggapnya berhasil secara diam-diam.
    if(json.duplicate){ err.duplicate = true; err.existing = json.existing; }
    if(json.blockedByTidakHadir){ err.blockedByTidakHadir = true; err.existing = json.existing; }
    throw err;
  }
  return json;
}

/* ================= STATUS KONEKSI SERVER (lampu indikator) ================= */
// [PERKUATAN KONEKSI] Lampu indikator kini:
//  - memakai BATAS WAKTU (timeout) + PERCOBAAN ULANG otomatis (cold start Apps Script
//    sering butuh beberapa detik; satu kali gagal TIDAK lagi langsung "Terputus"),
//  - tidak berkedip abu-abu saat pemeriksaan latar belakang (tetap hijau selama masih sehat),
//  - langsung HIJAU begitu permintaan apa pun ke server berhasil (data awal, simpan
//    presensi, dll.) — tanpa menunggu ping terpisah,
//  - memeriksa lebih sering (15 dtk) saat putus & lebih jarang (60 dtk) saat sehat,
//  - memeriksa ulang otomatis saat internet kembali / tab dibuka lagi / lampu diketuk,
//  - membedakan penyebab: tidak ada internet, akses server ditolak, atau kunci API salah.
const PING_TIMEOUT_MS = 20000;
const PING_RETRY_DELAYS_MS = [1500, 4000, 8000]; // total 4 percobaan
const HEALTH_INTERVAL_OK_MS = 60000;
const HEALTH_INTERVAL_DOWN_MS = 15000;
let serverCheckPromise = null;
let serverCheckTimer = null;
let lastServerOkAt = 0;

function serverStatusBadgeHtml(){
  const cfgMap = {
    checking:    { cls:'checking', label:'Memeriksa Server...' },
    retrying:    { cls:'retry',    label:'Menyambungkan Ulang...' },
    connected:   { cls:'on',       label:'Server Tersambung' },
    disconnected:{ cls:'off',      label:'Server Terputus', hint:'Pastikan Web App di-deploy dengan akses "Anyone" dan URL berakhiran /exec benar. Ketuk untuk cek ulang.' },
    denied:      { cls:'off',      label:'Akses Server Ditolak', hint:'Deploy Web App: Execute as "Me", Who has access "Anyone", lalu buat versi baru. Ketuk untuk cek ulang.' },
    badkey:      { cls:'off',      label:'Kunci API Salah', hint:'API_KEY di aplikasi harus sama dengan API_PASSWORD di sheet Config.' },
    offline:     { cls:'off',      label:'Tidak Ada Internet', hint:'Perangkat sedang offline. Akan tersambung otomatis saat internet kembali.' },
    unconfigured:{ cls:'off',      label:'Server Belum Diatur' },
  };
  const cfg = cfgMap[state.serverStatus] || cfgMap.disconnected;
  const detail = state.serverStatusDetail || cfg.hint || '';
  const title = (cfg.label + (detail ? ' — ' + detail : '')).replace(/"/g, '&quot;');
  return `<div class="server-status ${cfg.cls}" id="serverStatusBadge" title="${title}"><span class="dot"></span><span class="label">${cfg.label}</span></div>`;
}

function updateServerStatusBadge(){
  const el = document.getElementById('serverStatusBadge');
  if(el) el.outerHTML = serverStatusBadgeHtml();
}

function setServerStatus(status, detail){
  state.serverStatus = status;
  state.serverStatusDetail = detail || '';
  updateServerStatusBadge();
}

function sleepMs(ms){ return new Promise(r => setTimeout(r, ms)); }

async function fetchWithTimeout(url, opts, ms){
  const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), ms) : null;
  try{
    return await fetch(url, ctrl ? { ...opts, signal: ctrl.signal } : opts);
  }finally{
    if(timer) clearTimeout(timer);
  }
}

// Satu kali ping. Mengembalikan { status, final? }.
async function pingServerOnce(){
  const url = `${API_URL}?action=ping&key=${encodeURIComponent(API_KEY)}&_=${Date.now()}`;
  const res = await fetchWithTimeout(url, { method:'GET', cache:'no-store', credentials:'omit', redirect:'follow' }, PING_TIMEOUT_MS);
  const text = await res.text();
  let json = null;
  try{ json = JSON.parse(text); }catch(e){ /* bukan JSON */ }
  if(json && json.ok) return { status:'connected' };
  if(json && /api key/i.test(String(json.error || ''))) return { status:'badkey', final:true };
  if(!json) return { status:'denied' }; // biasanya halaman HTML login/izin Google
  return { status:'disconnected' };
}

async function runServerCheck(){
  const startedAt = Date.now();
  const wasConnected = state.serverStatus === 'connected';
  if(!wasConnected) setServerStatus('checking');

  let last = { status:'disconnected' };
  for(let attempt = 0; attempt <= PING_RETRY_DELAYS_MS.length; attempt++){
    try{
      last = await pingServerOnce();
    }catch(e){
      last = {
        status: (typeof navigator !== 'undefined' && navigator.onLine === false) ? 'offline' : 'disconnected',
        detail: (e && e.name === 'AbortError') ? 'Server lambat merespons (timeout). Ketuk untuk cek ulang.' : ''
      };
    }
    if(last.status === 'connected' || last.final || last.status === 'offline') break;
    if(attempt < PING_RETRY_DELAYS_MS.length){
      if(!wasConnected || attempt >= 1) setServerStatus('retrying');
      await sleepMs(PING_RETRY_DELAYS_MS[attempt]);
    }
  }
  // Kalau selama pemeriksaan ini ada permintaan lain yang BERHASIL, server jelas sehat.
  if(last.status !== 'connected' && lastServerOkAt >= startedAt) last = { status:'connected' };
  setServerStatus(last.status, last.detail);
}

function checkServerStatus(){
  if(!API_URL){ setServerStatus('unconfigured'); return Promise.resolve(); }
  if(serverCheckPromise) return serverCheckPromise;
  serverCheckPromise = runServerCheck()
    .catch(() => setServerStatus('disconnected'))
    .finally(() => { serverCheckPromise = null; scheduleServerCheck(); });
  return serverCheckPromise;
}

function scheduleServerCheck(delayMs){
  clearTimeout(serverCheckTimer);
  const d = (delayMs != null) ? delayMs : (state.serverStatus === 'connected' ? HEALTH_INTERVAL_OK_MS : HEALTH_INTERVAL_DOWN_MS);
  serverCheckTimer = setTimeout(checkServerStatus, d);
}

// Dipanggil setiap kali SEBUAH permintaan ke server berhasil dijawab.
function markServerConnected(){
  lastServerOkAt = Date.now();
  if(state.serverStatus !== 'connected') setServerStatus('connected');
  if(!serverCheckPromise) scheduleServerCheck();
}

function startServerHealthMonitor(){
  checkServerStatus();
  window.addEventListener('online', () => { checkServerStatus(); });
  window.addEventListener('offline', () => { setServerStatus('offline'); });
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible') checkServerStatus();
  });
  // Ketuk lampu indikator = paksa cek ulang sekarang.
  document.addEventListener('click', (e) => {
    const b = e.target && e.target.closest ? e.target.closest('#serverStatusBadge') : null;
    if(b && state.serverStatus !== 'checking' && state.serverStatus !== 'retrying') checkServerStatus();
  });
}

const STUDENTS_KEY = 'sigap_students_v1';
const LOG_MONTHS_TO_LOAD = 6; // tampilkan riwayat 6 bulan terakhir di panel Admin
const PHOTO_KEY_PREFIX = 'sigap_photo_';
// Cache "boot" (siswa + riwayat) dari pemuatan SUKSES terakhir — dipakai untuk
// menampilkan data SEKETIKA saat aplikasi dibuka kembali (stale-while-revalidate),
// alih-alih menampilkan layar kosong/spinner setiap kali dibuka. Hanya diisi
// dari data yang benar-benar berhasil diambil dari server, supaya yang
// ditampilkan pertama kali selalu representasi data server yang valid
// (walau mungkin sudah agak basi beberapa menit/jam), bukan data lokal
// yang belum tentu sinkron.
const BOOT_CACHE_KEY = 'sigap_boot_cache_v1';

function loadBootCacheLocal(){
  try{
    const raw = localStorage.getItem(BOOT_CACHE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.students)) return null;
    return parsed;
  }catch(e){ return null; }
}
function saveBootCacheLocal(students, logs){
  try{
    localStorage.setItem(BOOT_CACHE_KEY, JSON.stringify({ students, logs, ts: Date.now() }));
  }catch(e){ /* localStorage penuh/tidak tersedia — abaikan, cache hanya mempercepat, bukan wajib */ }
}

// Foto siswa disimpan TERPISAH di localStorage browser (bukan ikut di
// dalam JSON data siswa utama), supaya: (1) tetap tersimpan walau file
// ini dibuka di luar Claude/artifact (localStorage bawaan browser, tidak
// bergantung window.storage), dan (2) tidak membuat data siswa utama
// membengkak ukurannya kalau fotonya banyak.

  }
}

}

function monthKeyOf(ts){
  const d = new Date(ts);
  return `sigap_logs_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function currentMonthKey(){ return monthKeyOf(Date.now()); }

async function loadData(){
  // --- 0) Tampilkan cache LOKAL (kalau ada) SEKETIKA, supaya aplikasi
  //     langsung terasa terisi walau data terbaru dari server belum datang.
  //     Ini yang paling terasa mempercepat "pertama kali dibuka" pada
  //     pemakaian sehari-hari, karena hampir selalu sudah ada cache dari
  //     pembukaan sebelumnya. Begitu data terbaru dari server selesai
  //     diambil di bawah, tampilan diperbarui lagi secara diam-diam
  //     (stale-while-revalidate) — tanpa mengganggu apa pun yang sedang
  //     dilakukan pengguna kalau nilainya ternyata sama.
  const cached = loadBootCacheLocal();
  if(cached){
    state.students = cached.students;
    state.logs = Array.isArray(cached.logs) ? cached.logs : [];
    render();
  }

  // --- 1) Ambil data SISWA + RIWAYAT GERBANG dari server dalam SATU
  //     permintaan jaringan (aksi "getBootstrap") — inilah optimasi
  //     terdalam: bukan sekadar dua permintaan paralel seperti sebelumnya,
  //     tapi benar-benar SATU kali overhead permintaan ke Apps Script.
  //     Kalau aksi ini belum dikenali server (Code.gs lama, belum sempat
  //     di-redeploy), otomatis jatuh kembali ke dua permintaan terpisah
  //     yang dijalankan paralel — aplikasi tetap berfungsi normal, hanya
  //     sedikit lebih lambat sampai Code.gs-nya diperbarui.
  let loadedFromServer = false;
  let logsFromServer = false;
  if(API_URL){
    try{
      const boot = await fetchBootstrapFromServer();
      if(Array.isArray(boot.students)){ state.students = boot.students; loadedFromServer = true; }
      if(Array.isArray(boot.logs)){ state.logs = boot.logs; logsFromServer = true; }
    }catch(e){
      // Fallback: Code.gs belum punya aksi "getBootstrap", atau permintaan
      // gagal karena sebab lain — coba dua permintaan terpisah secara paralel.
      const [studentsResult, logsResult] = await Promise.allSettled([
        fetchStudentsFromServer(),
        fetchLogsFromServer(),
      ]);
      if(studentsResult.status === 'fulfilled'){ state.students = studentsResult.value; loadedFromServer = true; }
      if(logsResult.status === 'fulfilled'){ state.logs = logsResult.value; logsFromServer = true; }
    }
  }

  if(!loadedFromServer && !cached){
    try{
      const r = await window.storage.get(STUDENTS_KEY, false);
      if(r && r.value) state.students = JSON.parse(r.value) || [];
    }catch(e){ /* belum ada data siswa */ }
  }
  // foto: kalau terhubung server, foto sudah ikut datang dari kolom
  // "Foto" di getStudents (lihat panduan Code.gs). Kalau TIDAK terhubung
  // server (mode lokal), foto diambil dari localStorage browser ini.
  if(!loadedFromServer){
    state.students.forEach(s=>{ const p = loadPhotoLocal(s.id); if(p) s.photo = p; });
  }

  if(!logsFromServer && !cached){
    try{
      const listed = await window.storage.list('sigap_logs_', false);
      const monthKeys = (listed && listed.keys ? listed.keys : []).sort().reverse().slice(0, LOG_MONTHS_TO_LOAD);
      let allLogs = [];
      for(const k of monthKeys){
        try{
          const r = await window.storage.get(k, false);
          if(r && r.value){ allLogs = allLogs.concat(JSON.parse(r.value) || []); }
        }catch(e){ /* lewati bulan ini jika gagal dibaca */ }
      }
      state.logs = allLogs;
    }catch(e){ /* belum ada riwayat sama sekali */ }
  }

  // --- 2) Simpan cache lokal untuk pembukaan aplikasi BERIKUTNYA — hanya
  //     jika datanya benar-benar berhasil diambil dari server (sumber
  //     paling akurat), supaya cache tidak pernah menyimpan data yang
  //     sudah ketinggalan/gagal sinkron.
  if(loadedFromServer && logsFromServer){
    saveBootCacheLocal(state.students, state.logs);
  }

  render();
}

async function fetchStudentsFromServer(){
  const res = await fetch(`${API_URL}?action=getStudents&key=${encodeURIComponent(API_KEY)}`);
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'Gagal memuat data siswa dari server.');
  markServerConnected();
  return json.data || [];
}

async function fetchLogsFromServer(){
  const res = await fetch(`${API_URL}?action=getRecentLogs&key=${encodeURIComponent(API_KEY)}&months=${LOG_MONTHS_TO_LOAD}`);
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'Gagal memuat riwayat dari server.');
  markServerConnected();
  return json.data || [];
}

// [OPTIMASI] Ambil data siswa DAN riwayat gerbang dalam SATU permintaan
// jaringan (aksi "getBootstrap" di Code.gs), bukan dua permintaan terpisah
// — walau dua permintaan terpisah sudah dijalankan paralel, tiap permintaan
// ke Apps Script tetap kena overhead tersendiri (terutama saat "cold start").
// Menggabungkannya jadi satu permintaan menghilangkan satu porsi overhead
// itu sepenuhnya. Kalau Code.gs yang terpasang belum punya aksi ini (belum
// sempat di-redeploy dengan versi terbaru), fetch ini akan gagal dengan
// pesan "Aksi tidak dikenal", dan pemanggilnya (loadData) otomatis jatuh
// kembali ke dua permintaan terpisah seperti sebelumnya — jadi aplikasi
// tetap berfungsi normal walau lupa redeploy, hanya sedikit lebih lambat.
async function fetchBootstrapFromServer(){
  const res = await fetch(`${API_URL}?action=getBootstrap&key=${encodeURIComponent(API_KEY)}&months=${LOG_MONTHS_TO_LOAD}`);
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'Gagal memuat data awal dari server.');
  markServerConnected();
  return json.data || {};
}

// Mengirim catatan Masuk/Pulang/Alpa ke SERVER dan MENUNGGU konfirmasinya —
// inilah kunci pencegahan pemindaian ganda LINTAS PERANGKAT: server (bukan
// cache lokal HP ini) yang memutuskan apakah siswa ini sudah tercatat hari
// ini oleh perangkat lain. Mengembalikan salah satu dari:
//   { ok:true }                          — tersimpan & terverifikasi server
//   { ok:false, duplicate:true, existing } — DITOLAK, sudah tercatat (di
//                                            perangkat manapun) — `existing`
//                                            dipakai untuk menyelaraskan
//                                            cache lokal & pesan notifikasi
//   { ok:false, blockedByTidakHadir:true, existing } — DITOLAK karena siswa
//                                            ini SUDAH tercatat Tidak Hadir
//                                            (Sakit/Ijin/Emergency/Lainnya)
//                                            hari ini — tidak boleh lagi
//                                            tercatat Masuk/Pulang di hari
//                                            yang sama (lihat addLog_ di
//                                            Code.gs)
//   { ok:true, offline:true }            — server tak terjangkau, tersimpan
//                                            LOKAL saja (tidak terverifikasi
//                                            lintas perangkat)
async function saveLogEntry(log){
  if(API_URL){
    try{
      await callApi({ action:'addLog', log });
      return { ok:true };
    }catch(e){
      if(e.duplicate){
        return { ok:false, duplicate:true, existing:e.existing };
      }
      if(e.blockedByTidakHadir){
        return { ok:false, blockedByTidakHadir:true, existing:e.existing };
      }
      // gagal karena sebab lain (jaringan/server) — lanjut ke penyimpanan
      // lokal di bawah supaya catatan tidak hilang, tapi ditandai `offline`
      // karena TIDAK bisa dijamin bebas duplikat lintas perangkat.
    }
  }
  const key = monthKeyOf(log.timestamp);
  try{
    let monthLogs = [];
    try{
      const r = await window.storage.get(key, false);
      if(r && r.value) monthLogs = JSON.parse(r.value) || [];
    }catch(e){ /* bulan ini belum punya data */ }
    monthLogs.push(log);
    await window.storage.set(key, JSON.stringify(monthLogs), false);
  }catch(e){ /* gagal menyimpan catatan gerbang */ }
  return { ok:true, offline:!API_URL ? undefined : true };
}

// Memperbarui keterangan (ket/note) pada catatan masuk/pulang yang SUDAH ADA —
// dipakai oleh mode "Input Manual" (keterangan tambahan bersifat opsional),
// bukan membuat baris riwayat baru.
async function updateLogEntry(log){
  if(API_URL){
    try{
      await callApi({ action:'updateLog', log });
      return;
    }catch(e){
      // lanjut ke penyimpanan lokal di bawah supaya perubahan tidak hilang
    }
  }
  const key = monthKeyOf(log.timestamp);
  try{
    let monthLogs = [];
    try{
      const r = await window.storage.get(key, false);
      if(r && r.value) monthLogs = JSON.parse(r.value) || [];
    }catch(e){ /* bulan ini belum punya data */ }
    const idx = monthLogs.findIndex(l=>l.id===log.id);
    if(idx>=0){ monthLogs[idx] = log; } else { monthLogs.push(log); }
    await window.storage.set(key, JSON.stringify(monthLogs), false);
  }catch(e){ /* gagal menyimpan perubahan keterangan */ }
}

function waLink(phone, text){
  let p = (phone||'').replace(/[^0-9]/g,'');
  if(p.startsWith('0')) p = '62' + p.slice(1);
  if(!p.startsWith('62')) p = '62' + p;
  return `https://wa.me/${p}?text=${encodeURIComponent(text)}`;
}

function buildWaMessage(student, type, ket, note, updated, alpaKet){
  const displayKet = ket || 'Hadir';
  let msg = `*CATATAN PRESENSI SISWA SISWI*\n*Modernisasi Sistem Administrasi*\n\nAssalamu'alaikum, Bapak/Ibu Wali dari *${student.name}* (${student.kelas}).\n\n`;
  if(alpaKet){
    // Pesan KHUSUS untuk Input Keterangan pada siswa yang sistem tandai Alpa
    // secara OTOMATIS (tidak ada aktivitas presensi sama sekali hari itu).
    // TIDAK ada status "Tiba di Sekolah" maupun "Pulang" yang relevan di
    // sini — jadi dibuat sesingkat & sedetail mungkin. Dua kemungkinan:
    //  - Petugas mengonfirmasi TETAP tanpa keterangan (ket==='Alpa') → pesan
    //    menegaskan siswa memang tidak hadir tanpa alasan hingga saat ini.
    //  - Petugas memberi alasan jelas (Sakit/Ijin/Bolos/Emergency/Lainnya)
    //    → pesan menjelaskan bahwa status awalnya otomatis (Alpa), lalu
    //    diperbarui dengan keterangan yang sebenarnya.
    if(displayKet === 'Alpa'){
      msg += `Status: *TIDAK HADIR TANPA KETERANGAN (ALPA)*\nSiswa tidak masuk sekolah hari ini tanpa ada konfirmasi/alasan hingga saat ini.\nWaktu diperbarui: ${nowStr()} WIT`;
    }else{
      msg += `Status: *TIDAK HADIR*\nKeterangan: *${displayKet}* (semula tercatat Alpa otomatis oleh sistem, telah diperbarui petugas)\nWaktu diperbarui: ${nowStr()} WIT`;
    }
  }else if(type === 'tidakHadir'){
    msg += `Status: *TIDAK HADIR*\nKeterangan: *${displayKet}*\nWaktu dicatat: ${nowStr()} WIT`;
  }else if(type === 'manual'){
    msg += `Keterangan: *${displayKet}*\nWaktu dicatat: ${nowStr()} WIT`;
  }else{
    const label = type === 'masuk' ? 'TIBA DI SEKOLAH' : 'PULANG SEKOLAH';
    msg += `Status: *${label}*\nWaktu: ${nowStr()} WIT`;
    // Baris "Keterangan" hanya ditampilkan jika ada catatan khusus (Sakit/Ijin/dll)
    // yang ditambahkan lewat Input Manual (Keterangan) — pemindaian masuk/pulang
    // biasa tidak membawa keterangan apa pun.
    if(ket && ket !== 'Hadir'){ msg += `\nKeterangan: *${displayKet}*`; }
  }
  if(ket === 'Lainnya' && note) msg += ` — ${note}`;
  if(ket && ket !== 'Hadir') msg += `\n\nMohon menjadi perhatian Bapak/Ibu.`;
  msg += `\n\nPesan otomatis, mohon tidak dibalas.`;
  return msg;
}

function isToday(ts){ const d=new Date(ts), t=new Date(); return d.toDateString()===t.toDateString(); }

// Ambil catatan Masuk & Pulang milik siswa untuk HARI INI (dari pemindaian QR
// maupun Input Manual Masuk/Pulang) — dipakai mode Input Manual (keterangan)
// untuk menentukan catatan mana yang boleh diberi keterangan tambahan.
function todayLogsFor(studentId){
  const todays = state.logs.filter(l=> l.studentId===studentId && isToday(l.timestamp) && (l.type==='masuk'||l.type==='pulang'));
  const latestOf = type => todays.filter(l=>l.type===type).sort((a,b)=>b.timestamp-a.timestamp)[0] || null;
  return { masuk: latestOf('masuk'), pulang: latestOf('pulang') };
}

// Ambil catatan "Tidak Hadir" (Sakit/Ijin/Emergency/Lainnya) milik siswa untuk
// HARI INI, jika ada — dipakai mode "Input Sakit/Ijin/Emergency" supaya operator
// bisa MENGUBAH keterangan yang sudah tersimpan (bukan membuat catatan ganda)
// kalau siswa yang sama diinput ulang di hari yang sama.
function todayTidakHadirFor(studentId){
  return state.logs
    .filter(l=> l.studentId===studentId && isToday(l.timestamp) && l.type==='tidakHadir')
    .sort((a,b)=>b.timestamp-a.timestamp)[0] || null;
}

function adminRiwayatTab(){
  // Urutkan Data Absen berdasarkan KELAS (paling awal → paling akhir), lalu di
  // dalam kelas yang sama diurutkan ABJAD nama siswa A–Z. {numeric:true} membuat
  // urutan kelas dengan angka (mis. "XI-2" vs "XI-10") terbaca sesuai urutan
  // angkanya, bukan sekadar urutan huruf. Waktu pemindaian hanya jadi penentu
  // terakhir (untuk siswa yang sama, Masuk tetap tampil sebelum Pulang).
  const logs = [...state.logs].sort((a,b)=>{
    const sa = state.students.find(x=>x.id===a.studentId);
    const sb = state.students.find(x=>x.id===b.studentId);
    const kelasCmp = String(sa?sa.kelas:'').localeCompare(String(sb?sb.kelas:''), 'id', {numeric:true, sensitivity:'base'});
    if(kelasCmp !== 0) return kelasCmp;
    const nameCmp = String(sa?sa.name:'').localeCompare(String(sb?sb.name:''), 'id', {sensitivity:'base'});
    if(nameCmp !== 0) return nameCmp;
    return a.timestamp - b.timestamp;
  });
  return `
  <div class="panel">
    <h4 style="font-family:'Space Grotesk';font-size:18.75px;margin-bottom:6px;">Riwayat Gerbang</h4>
    ${logs.length===0 ? emptyState('Belum ada catatan pemindaian.') : `

      <div class="log-row head"><div>Waktu</div><div>Siswa</div><div>Mode</div><div>Keterangan</div><div>Catatan</div></div>
      ${logs.map(l=>{
        const s = state.students.find(x=>x.id===l.studentId);
        return `<div class="log-row">
          <div class="log-time">${dateOnly(l.timestamp)}<br>${timeOnly(l.timestamp)}</div>
          <div>${s?escapeHtml(s.name):'(dihapus)'}${s?`<br><span style="font-size:12.5px;color:var(--text-faint);">${escapeHtml(s.kelas)}</span>`:''}</div>
          <div><span class="pill ${l.type}">${l.type==='masuk'?'Masuk':l.type==='pulang'?'Pulang':l.type==='tidakHadir'?'Tidak Hadir':'Manual'}</span></div>
          <div><span class="pill ket-${l.ket||'Hadir'}">${l.ket||'Hadir'}</span></div>
          <div style="color:var(--text-faint); font-size:15px;">${escapeHtml(l.note||'')}</div>
        </div>`;
      }).join('')}
    </div>`}
  </div>`;
}
