          <div class="m-icon">${ICON.masuk}</div>
          <div class="mode-text"><h4>Pemindai Masuk</h4><p>Catat kedatangan siswa di gerbang sekolah.</p></div>
        </div>
        <div class="mode-card pulang" id="modePulang">
          <div class="m-icon">${ICON.pulang}</div>
          <div class="mode-text"><h4>Pemindai Pulang</h4><p>Catat kepulangan siswa dari sekolah.</p></div>
        </div>
        <div class="mode-card masuk" id="modeManualMasuk">
          <div class="m-icon">${ICON.masuk}</div>
          <div class="mode-text"><h4>Input Manual Masuk</h4><p>Catat kedatangan siswa tanpa pindai QR — kartu hilang atau lupa dibawa.</p><span class="m-badge">Tanpa QR</span></div>
        </div>
        <div class="mode-card pulang" id="modeManualPulang">
          <div class="m-icon">${ICON.pulang}</div>
          <div class="mode-text"><h4>Input Manual Pulang</h4><p>Catat kepulangan siswa tanpa pindai QR — kartu hilang atau lupa dibawa.</p><span class="m-badge">Tanpa QR</span></div>
        </div>
        <div class="mode-card manual" id="modeManual">
          <div class="m-icon">${ICON.manual}</div>
          <div class="mode-text"><h4>Input Keterangan</h4><p>Tambahkan keterangan opsional (Sakit, Ijin, Bolos, Emergency dll) untuk siswa yang sudah tercatat masuk/pulang — via QR maupun input manual.</p></div>
        </div>
        <div class="mode-card manual" id="modeTidakHadir">
          <div class="m-icon">${ICON.sakitIjin}</div>
          <div class="mode-text"><h4>Input Sakit / Ijin / Emergency</h4><p>Catat siswa yang belum tercatat masuk maupun pulang sama sekali karena Sakit, Ijin, atau Emergency lainnya — bukan Alpa. Bisa ketik alasan sendiri.</p><span class="m-badge">Tanpa QR</span></div>
        </div>
        <div class="mode-card manual" id="modeAlpaKet">
          <div class="m-icon">${ICON.alpa}</div>
          <div class="mode-text"><h4>Input Keterangan (Alpa Otomatis)</h4><p>Tambahkan keterangan bagi siswa yang tercatat Alpa secara OTOMATIS oleh sistem (belum ada aktivitas presensi sama sekali sampai jam pengecekan).</p></div>
        </div>
      </div>
    </div>
  </div>`;
}

/* ================= PETUGAS: layar scan ================= */
function screenPetugasScan(){
  const isManual = state.petugasMode !== 'masuk' && state.petugasMode !== 'pulang';
  const modeLabel = state.petugasMode==='masuk' ? 'Pemindai Masuk'
    : state.petugasMode==='pulang' ? 'Pemindai Pulang'
    : state.petugasMode==='manualMasuk' ? 'Input Manual Masuk'
    : state.petugasMode==='manualPulang' ? 'Input Manual Pulang'
    : state.petugasMode==='tidakHadir' ? 'Input Sakit / Ijin / Emergency'
    : state.petugasMode==='alpaKet' ? 'Input Keterangan (Alpa Otomatis)'
    : 'Input Keterangan';
  const modeTag = state.petugasMode==='masuk' ? 'MASUK'
    : state.petugasMode==='pulang' ? 'PULANG'
    : state.petugasMode==='manualMasuk' ? 'MANUAL MASUK'
    : state.petugasMode==='manualPulang' ? 'MANUAL PULANG'
    : state.petugasMode==='tidakHadir' ? 'TIDAK HADIR'
    : state.petugasMode==='alpaKet' ? 'ALPA OTOMATIS'
    : 'KETERANGAN';
  return `
  <div class="screen">
    ${screenHeaderBar(`${modeLabel} <span class="tag">${modeTag}</span>`)}
    <div class="screen-body">
      <div class="scan-layout">
        <div>
          ${isManual ? '' : `
          <div class="scan-panel">
            <div class="cam-frame" id="camFrame">
              <video id="camVideo" playsinline webkit-playsinline muted autoplay></video>
              <div class="brackets"></div><div class="bracket-tr"></div><div class="bracket-bl"></div>
              <div class="scanline" id="scanLine" style="display:none;"></div>
              <div class="cam-off" id="camOffMsg">${ICON.camOff}<span style="font-size:13.75px;">Kamera belum aktif</span></div>
            </div>
            <div style="display:flex; gap:8px; margin-top:10px;">
              <button class="btn btn-green" id="btnToggleCam" style="flex:1;">Aktifkan Kamera</button>
              <button class="btn btn-outline" id="btnToggleTorch" style="display:none; flex-shrink:0; padding:9px 14px;" title="Nyalakan/matikan senter">${ICON.torch||'💡'}</button>
            </div>
            <div class="cam-hint">Arahkan kartu QR siswa ke dalam bingkai kamera.</div>
          </div>
          <div class="divider-or">ATAU CARI MANUAL</div>`}
          <div class="scan-panel" style="text-align:left;">
            ${isManual ? `<p style="font-size:15px;color:var(--text-dim);margin-bottom:10px;">${
              state.petugasMode==='manualMasuk' ? 'Cari siswa untuk mencatat kedatangan secara manual tanpa pindai QR.'
              : state.petugasMode==='manualPulang' ? 'Cari siswa untuk mencatat kepulangan secara manual tanpa pindai QR.'
              : state.petugasMode==='tidakHadir' ? 'Cari siswa yang belum tercatat masuk/pulang hari ini untuk mencatat alasan Sakit, Ijin, atau Emergency lainnya (bukan Alpa).'
              : state.petugasMode==='alpaKet' ? 'Cari siswa yang hari ini tercatat Alpa secara OTOMATIS oleh sistem, untuk menambahkan keterangan yang sebenarnya.'
              : 'Cari siswa yang sudah tercatat masuk/pulang hari ini untuk menambahkan keterangan opsional (Sakit, Ijin, Bolos, Emergency dll).'
            }</p>` : ''}
            <div class="search-box">
              <input class="field" id="searchInput" placeholder="Cari nama siswa atau kelas..." style="width:100%;background:var(--well);border:1px solid var(--line-strong);border-radius:7px;padding:7px 10px;color:var(--text);font-size:14.38px;">
            </div>
            <div class="search-results" id="searchResults">${searchResultsHtml()}</div>
          </div>
        </div>

        <div class="side-panel" id="sidePanel">${sidePanelContent()}</div>
      </div>
    </div>
  </div>`;
}

function searchResultsHtml(){
  const q = (state.searchQuery||'').toLowerCase();
  // Mode "Input Manual Masuk"/"Input Manual Pulang" — daftar HANYA berisi
  // siswa yang HARI INI BELUM tercatat Masuk/Pulang (baik lewat pindai QR
  // maupun input manual sebelumnya) DAN BELUM tercatat "Tidak Hadir"
  // (Sakit/Ijin/Emergency/Lainnya — termasuk keterangan tulisan bebas).
  // Siswa yang sudah dinyatakan Tidak Hadir TIDAK BOLEH lagi dicatat
  // Masuk/Pulang di hari yang sama (server juga menolak permintaan ini
  // secara mandiri lewat addLog_ di Code.gs, berlaku lintas perangkat —
  // filter di sini murni supaya petugas tidak perlu mencoba dulu).
  // Mode "Input Sakit/Ijin/Emergency" (tidakHadir) — daftar HANYA berisi
  // siswa yang HARI INI BENAR-BENAR BELUM tercatat APA PUN sama sekali
  // pada kolom Jenis di sheet Absensi — bukan Masuk, bukan Alpa (Alpa
  // menempati slot "masuk" yang sama), bukan Pulang, dan bukan pula
  // sudah tercatat Tidak Hadir sebelumnya (Sakit/Ijin/Emergency/Lainnya).
  // Siswa yang sudah punya catatan APA PUN hari ini TIDAK ditampilkan
  // lagi di sini — kalau memang keterangannya perlu diubah, gunakan tombol
  // "Keterangan" pada mode Input Manual (Keterangan) untuk catatan yang
  // sudah ada, bukan lewat mode ini.
  const baseList = state.petugasMode === 'alpaKet'
    ? state.students.filter(s => { const log = todayLogsFor(s.id).masuk; return log && log.ket === 'Alpa'; })
    : state.petugasMode === 'manualMasuk'
    ? state.students.filter(s => !todayLogsFor(s.id).masuk && !todayTidakHadirFor(s.id))
    : state.petugasMode === 'manualPulang'
    ? state.students.filter(s => !todayLogsFor(s.id).pulang && !todayTidakHadirFor(s.id))
    : state.petugasMode === 'tidakHadir'
    ? state.students.filter(s => !todayLogsFor(s.id).masuk && !todayLogsFor(s.id).pulang && !todayTidakHadirFor(s.id))
    : state.students;
  const list = baseList.filter(s => !q || s.name.toLowerCase().includes(q) || s.kelas.toLowerCase().includes(q)).slice(0,8);
  if(state.students.length===0) return emptyState('Belum ada data siswa. Tambahkan lewat panel Admin.');
  if(state.petugasMode === 'alpaKet' && baseList.length===0){
    return `<div style="padding:16px;color:var(--text-faint);font-size:16.25px;">Belum ada siswa yang tercatat Alpa otomatis hari ini.</div>`;
  }
  if(state.petugasMode === 'manualMasuk' && baseList.length===0){
    return `<div style="padding:16px;color:var(--text-faint);font-size:16.25px;">Semua siswa sudah tercatat Masuk atau Tidak Hadir hari ini.</div>`;
  }
  if(state.petugasMode === 'manualPulang' && baseList.length===0){
    return `<div style="padding:16px;color:var(--text-faint);font-size:16.25px;">Semua siswa sudah tercatat Pulang atau Tidak Hadir hari ini.</div>`;
  }
  if(state.petugasMode === 'tidakHadir' && baseList.length===0){
    return `<div style="padding:16px;color:var(--text-faint);font-size:16.25px;">Semua siswa sudah memiliki catatan (Masuk/Alpa/Pulang/Tidak Hadir) hari ini.</div>`;
  }
  if(list.length===0) return `<div style="padding:16px;color:var(--text-faint);font-size:16.25px;">Tidak ditemukan.</div>`;
  return list.map(s=>`
    <button class="search-item" data-pick="${s.id}">
      <div class="stu-avatar" style="width:32px;height:32px;font-size:15px;">${initials(s.name)}</div>
      <div class="stu-info"><div class="nm" style="font-size:16.25px;">${escapeHtml(s.name)}</div><div class="meta">${escapeHtml(s.kelas)}</div></div>
    </button>`).join('');
}

function sidePanelContent(){
  const mode = state.petugasMode;
  const isQuickManual = mode === 'manualMasuk' || mode === 'manualPulang';
  if(state.lastResult){
    const {student, ket, sendWa, type, updated, alpaKet} = state.lastResult;
    const effectiveType = type || (mode==='manualMasuk' ? 'masuk' : mode==='manualPulang' ? 'pulang' : mode);
    const statusLabel = alpaKet ? 'Alpa Otomatis → Keterangan' : effectiveType==='masuk' ? 'Masuk' : effectiveType==='pulang' ? 'Pulang' : effectiveType==='tidakHadir' ? 'Tidak Hadir' : 'Keterangan';
    // Tampilkan "· <keterangan>" hanya jika ada keterangan khusus (Sakit/Ijin/dll).
    // Pemindaian masuk/pulang biasa tidak membawa keterangan apa pun.
    const ketSuffix = ket ? ` · ${ket}` : '';
    const resultTitle = updated ? 'Keterangan Tersimpan' : 'Tercatat';
    const nextLabel = updated ? 'Tambahkan Lagi' : (mode==='masuk'||mode==='pulang') ? 'Pindai Berikutnya' : 'Catat Berikutnya';
    if(!sendWa){
      return `
      <div class="result-card">
        <div class="result-icon ok">${ICON.check}</div>
        <h3>${resultTitle}</h3>
        <p>${escapeHtml(student.name)} — ${statusLabel}${ketSuffix}</p>
        <p style="font-size:14.38px;color:var(--text-faint);margin-bottom:14px;">Notifikasi WhatsApp tidak dikirim untuk catatan ini.</p>
        <button class="btn btn-outline btn-block" id="btnScanNext">${nextLabel}</button>
      </div>`;
    }
    const msg = buildWaMessage(student, effectiveType, ket, state.lainnyaNote, updated, alpaKet);
    return `
    <div class="result-card">
      <div class="result-icon ok">${ICON.check}</div>
      <h3>${resultTitle}</h3>
      <p>${escapeHtml(student.name)} — ${statusLabel}${ketSuffix}</p>
      <div class="wa-preview">${escapeHtml(msg)}</div>
      <a class="btn btn-green btn-block" href="${waLink(student.parentWA, msg)}" target="_blank" rel="noopener" style="margin-bottom:10px;">${ICON.wa} Kirim ke WA Orang Tua</a>
      <button class="btn btn-outline btn-block" id="btnScanNext">${nextLabel}</button>
    </div>`;
  }
  if(!state.selectedStudent){
    const title = mode==='manualMasuk' ? 'Input Manual Masuk' : mode==='manualPulang' ? 'Input Manual Pulang' : mode==='manual' ? 'Input Keterangan' : mode==='tidakHadir' ? 'Input Sakit / Ijin / Emergency' : mode==='alpaKet' ? 'Input Keterangan (Alpa Otomatis)' : 'Detail Pemindaian';
    const hint = mode==='manualMasuk' ? 'Cari dan pilih siswa untuk mencatat kedatangan secara manual tanpa pindai QR.'
      : mode==='manualPulang' ? 'Cari dan pilih siswa untuk mencatat kepulangan secara manual tanpa pindai QR.'
      : mode==='manual' ? 'Cari dan pilih siswa yang sudah tercatat masuk/pulang hari ini untuk menambahkan keterangan opsional.'
      : mode==='tidakHadir' ? 'Cari dan pilih siswa yang belum tercatat masuk/pulang hari ini untuk mencatat alasan Sakit, Ijin, atau Emergency lainnya — bukan Alpa.'
      : mode==='alpaKet' ? 'Cari dan pilih siswa yang hari ini tercatat Alpa secara OTOMATIS oleh sistem, untuk menambahkan keterangan yang sebenarnya (Sakit/Ijin/Bolos/Emergency/Lainnya).'
      : 'Pindai kartu QR atau pilih siswa dari pencarian untuk melanjutkan.';
    return `<h4>${ICON.qr} ${title}</h4><div class="placeholder">${hint}</div>`;
  }
  const s = state.selectedStudent;

  // Panel konfirmasi ringkas untuk SEMUA jenis pencatatan kehadiran (baik siswa
  // dipilih manual saat mode Pemindai Masuk/Pulang, maupun lewat Input Manual
  // Masuk/Pulang/Alpa) — TIDAK ada pilihan keterangan (Hadir/Sakit/dll) di sini
  // sama sekali (kecuali Alpa, yang memang keterangannya sudah pasti "Alpa").
  // Keterangan lain (Sakit/Ijin/dll) hanya dapat ditambahkan belakangan lewat
  // mode terpisah "Input Manual (Keterangan)" di bawah, untuk siswa yang sudah
  // tercatat masuk/pulang.
  if(mode === 'masuk' || mode === 'pulang' || isQuickManual){
    const type = mode === 'manualMasuk' ? 'masuk' : mode === 'manualPulang' ? 'pulang' : mode;
    const label = type === 'masuk' ? 'Masuk' : 'Pulang';
    const btnClass = type === 'masuk' ? 'btn-green' : 'btn-gold';
    const heading = isQuickManual ? `Input Manual ${label}` : 'Konfirmasi Kehadiran';
    return `
    <h4>${ICON.qr} ${heading}</h4>
    <div class="selected-stu">
      <div class="stu-avatar">${initials(s.name)}</div>
      <div class="stu-info"><div class="nm">${escapeHtml(s.name)}</div><div class="meta">${escapeHtml(s.kelas)} · <span class="code">${s.code}</span></div></div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:15px;color:var(--text-dim);margin-bottom:12px;cursor:pointer;">
      <input type="checkbox" id="waOptIn" ${state.sendWaNotif?'checked':''} style="width:15px;height:15px;accent-color:var(--gold);">
      Kirim notifikasi WhatsApp ke orang tua
    </label>
    <button class="btn ${btnClass} btn-block" id="btnQuickManualConfirm" data-type="${type}">${ICON[type]} Konfirmasi ${label}</button>
    <button class="btn btn-outline btn-block" id="btnCancelSelect" style="margin-top:8px;">Batal</button>
    `;
  }

  // Mode "Input Sakit/Ijin/Emergency" — khusus siswa yang BELUM tercatat masuk
  // maupun pulang sama sekali hari ini (tidak discan & tidak diinput manual).
  // Operator langsung memilih alasan ketidakhadiran (Sakit/Ijin/Emergency/ketik
  // sendiri) TANPA membuat catatan Masuk/Pulang — siswa ini memang tidak hadir,
  // jadi bukan Alpa (tanpa keterangan), melainkan tercatat dengan alasan yang jelas.
  if(mode === 'tidakHadir'){
    const already = todayLogsFor(s.id).masuk;
    if(already){
      return `
      <h4>${ICON.qr} Input Sakit / Ijin / Emergency</h4>
      <div class="selected-stu">
        <div class="stu-avatar">${initials(s.name)}</div>
        <div class="stu-info"><div class="nm">${escapeHtml(s.name)}</div><div class="meta">${escapeHtml(s.kelas)} · <span class="code">${s.code}</span></div></div>
      </div>
      <p style="font-size:14.38px;color:var(--text-faint);margin-bottom:12px;">Siswa ini sudah tercatat <b>Masuk</b> hari ini pukul ${timeOnly(already.timestamp)}. Gunakan mode <b>Input Keterangan</b> untuk menambahkan keterangan pada catatan yang sudah ada.</p>
      <button class="btn btn-outline btn-block" id="btnCancelSelect">Batal</button>
      `;
    }
    const existing = todayTidakHadirFor(s.id);
    return `
    <h4>${ICON.qr} Input Sakit / Ijin / Emergency</h4>
    <div class="selected-stu">
      <div class="stu-avatar">${initials(s.name)}</div>
      <div class="stu-info"><div class="nm">${escapeHtml(s.name)}</div><div class="meta">${escapeHtml(s.kelas)} · <span class="code">${s.code}</span></div></div>
    </div>
    <p style="font-size:14.38px;color:var(--text-faint);margin-bottom:12px;">${existing ? `Sudah tercatat <b>${escapeHtml(existing.ket)}</b> hari ini pukul ${timeOnly(existing.timestamp)}${existing.note?` · ${escapeHtml(existing.note)}`:''} — simpan lagi untuk mengubahnya.` : 'Siswa ini belum tercatat masuk maupun pulang hari ini. Pilih alasan ketidakhadirannya di bawah ini — siswa TIDAK dianggap Alpa.'}</p>
    <label style="display:flex;align-items:center;gap:8px;font-size:15px;color:var(--text-dim);margin-bottom:12px;cursor:pointer;">
      <input type="checkbox" id="waOptIn" ${state.sendWaNotif?'checked':''} style="width:15px;height:15px;accent-color:var(--gold);">
      Kirim notifikasi WhatsApp ke orang tua
    </label>
    <label style="display:block;font-size:15px;color:var(--text-dim);margin-bottom:8px;">Keterangan</label>
    <div class="ket-grid">
      ${TIDAK_HADIR_KET_OPTIONS.map(k=>`<button class="ket-opt ${state.selectedKet===k?'active':''} ${k==='Lainnya'?'ket-opt-add':''}" data-ket="${k}">${ketOptionLabel(k)}</button>`).join('')}
    </div>
    ${state.selectedKet==='Lainnya' ? `<div class="field"><input id="lainnyaInput" placeholder="Tulis alasan sendiri..." value="${escapeHtml(state.lainnyaNote)}" style="width:100%;background:var(--well);border:1px solid var(--line-strong);border-radius:7px;padding:7px 10px;color:var(--text);font-size:14.38px;"></div>` : ''}
    <button class="btn btn-gold btn-block" id="btnConfirmTidakHadir" style="margin-top:6px;">${state.sendWaNotif ? 'Simpan &amp; Siapkan Notifikasi WA' : 'Simpan Keterangan'}</button>
    <button class="btn btn-outline btn-block" id="btnCancelSelect" style="margin-top:8px;">Batal</button>
    `;
  }

  // Mode "Input Keterangan (Alpa Otomatis)" — KHUSUS untuk mengubah keterangan
  // siswa yang HARI INI ditandai "Alpa" secara OTOMATIS oleh sistem (trigger
  // markAbsentStudentsAlpa_ di Code.gs, karena tidak ada aktivitas presensi
  // sama sekali sampai jam pengecekan pukul 10.00). TIDAK membuat catatan
  // baru — mengubah catatan Masuk yang sudah ada (Jenis "Alpa") menjadi
  // keterangan yang lebih jelas (Sakit/Ijin/Bolos/Emergency/Lainnya), MIRIP
  // dengan Input Keterangan biasa, tapi pesan WA-nya SENGAJA dibedakan (lihat
  // buildWaMessage) karena di sini TIDAK ADA status "Tiba di Sekolah" maupun
  // "Pulang" yang relevan — siswa ini memang tidak tercatat hadir sama sekali.
  if(mode === 'alpaKet'){
    const log = todayLogsFor(s.id).masuk;
    const isAlpa = log && log.ket === 'Alpa';
    if(!isAlpa){
      return `
      <h4>${ICON.qr} Input Keterangan (Alpa Otomatis)</h4>
      <div class="selected-stu">
        <div class="stu-avatar">${initials(s.name)}</div>
        <div class="stu-info"><div class="nm">${escapeHtml(s.name)}</div><div class="meta">${escapeHtml(s.kelas)} · <span class="code">${s.code}</span></div></div>
      </div>
      <p style="font-size:14.38px;color:var(--text-faint);margin-bottom:12px;">${log ? `Siswa ini tercatat <b>${escapeHtml(log.ket||'Hadir')}</b> hari ini, bukan Alpa — gunakan mode <b>Input Keterangan</b> biasa untuk mengubahnya.` : 'Siswa ini belum ditandai Alpa otomatis hari ini — mungkin belum lewat jam pengecekan (sekitar pukul 10.00), atau memang belum ada catatan presensi apa pun.'}</p>
      <button class="btn btn-outline btn-block" id="btnCancelSelect">Batal</button>
      `;
    }
    return `
    <h4>${ICON.qr} Input Keterangan (Alpa Otomatis)</h4>
    <div class="selected-stu">
      <div class="stu-avatar">${initials(s.name)}</div>
      <div class="stu-info"><div class="nm">${escapeHtml(s.name)}</div><div class="meta">${escapeHtml(s.kelas)} · <span class="code">${s.code}</span></div></div>
    </div>
    <p style="font-size:14.38px;color:var(--text-faint);margin-bottom:12px;">Siswa ini tercatat <b>Alpa</b> secara otomatis oleh sistem (tidak ada aktivitas presensi sama sekali hari ini). Pilih keterangan yang sebenarnya di bawah ini.</p>
    <label style="display:flex;align-items:center;gap:8px;font-size:15px;color:var(--text-dim);margin-bottom:12px;cursor:pointer;">
      <input type="checkbox" id="waOptIn" ${state.sendWaNotif?'checked':''} style="width:15px;height:15px;accent-color:var(--gold);">
      Kirim notifikasi WhatsApp ke orang tua
    </label>
    <label style="display:block;font-size:15px;color:var(--text-dim);margin-bottom:8px;">Keterangan</label>
    <div class="ket-grid">
      ${ALPA_KET_OPTIONS.map(k=>`<button class="ket-opt ${state.selectedKet===k?'active':''} ${k==='Lainnya'?'ket-opt-add':''}" data-ket="${k}">${ketOptionLabel(k)}</button>`).join('')}
    </div>
    ${state.selectedKet==='Lainnya' ? `<div class="field"><input id="lainnyaInput" placeholder="Tulis keterangan..." value="${escapeHtml(state.lainnyaNote)}" style="width:100%;background:var(--well);border:1px solid var(--line-strong);border-radius:7px;padding:7px 10px;color:var(--text);font-size:14.38px;"></div>` : ''}
    <button class="btn btn-gold btn-block" id="btnSaveAlpaKet" style="margin-top:6px;">${state.sendWaNotif ? 'Simpan &amp; Siapkan Notifikasi WA' : 'Simpan Keterangan'}</button>
    <button class="btn btn-outline btn-block" id="btnCancelSelect" style="margin-top:8px;">Batal</button>
    `;
  }

  // Mode "Input Manual" (keterangan) — TIDAK membuat catatan baru. Menambahkan
  // keterangan opsional (Sakit/Ijin/Alpa/dll) pada catatan Masuk atau Pulang
  // siswa yang HARI INI sudah tercatat, baik lewat pindai QR maupun input manual.
  // Ini SATU-SATUNYA tempat keterangan (selain "Hadir") bisa ditambahkan — untuk
  // siswa yang masuk/pulang dalam keadaan Sakit, Ijin, Bolos, Emergency, dll.
  if(mode === 'manual'){
    const t = todayLogsFor(s.id);

    if(!state.selectedKetTarget){
      const slot = (type, log) => {
        const label = type==='masuk' ? 'Masuk' : 'Pulang';
        if(!log){
          return `<div class="ket-slot ket-slot-empty">
            <div class="ket-slot-label">${label}</div>
            <div class="ket-slot-info">Belum tercatat hari ini</div>
          </div>`;
        }
        return `<button class="ket-slot" data-ket-target="${type}">
          <div class="ket-slot-label">${label}&nbsp; <span class="pill ket-${log.ket||'Hadir'}">${log.ket||'Hadir'}</span></div>
          <div class="ket-slot-info">Tercatat ${timeOnly(log.timestamp)}${log.note?` · ${escapeHtml(log.note)}`:''}</div>
        </button>`;
      };
      const noneYet = !t.masuk && !t.pulang;
      return `
      <h4>${ICON.qr} Input Keterangan</h4>
      <div class="selected-stu">
        <div class="stu-avatar">${initials(s.name)}</div>
        <div class="stu-info"><div class="nm">${escapeHtml(s.name)}</div><div class="meta">${escapeHtml(s.kelas)} · <span class="code">${s.code}</span></div></div>
      </div>
      <label style="display:block;font-size:15px;color:var(--text-dim);margin-bottom:8px;">Pilih catatan hari ini untuk ditambahkan keterangan</label>
      <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:6px;">
        ${slot('masuk', t.masuk)}
        ${slot('pulang', t.pulang)}
      </div>
      ${noneYet ? `<p style="font-size:14.38px;color:var(--text-faint);margin:6px 0 12px;">Siswa ini belum tercatat masuk maupun pulang hari ini. Lakukan pemindaian QR atau Input Manual Masuk/Pulang terlebih dahulu.</p>` : ''}
      <button class="btn btn-outline btn-block" id="btnCancelSelect" style="margin-top:8px;">Batal</button>
      `;
    }

    const type = state.selectedKetTarget;
    const log = t[type];
    if(!log){ state.selectedKetTarget = null; return sidePanelContent(); }
    const label = type==='masuk' ? 'Masuk' : 'Pulang';
    return `
    <h4>${ICON.qr} Keterangan ${label}</h4>
    <div class="selected-stu">
      <div class="stu-avatar">${initials(s.name)}</div>
      <div class="stu-info"><div class="nm">${escapeHtml(s.name)}</div><div class="meta">${escapeHtml(s.kelas)} · <span class="code">${s.code}</span></div></div>
    </div>
    <p style="font-size:14.38px;color:var(--text-faint);margin-bottom:12px;">${label} tercatat ${timeOnly(log.timestamp)} · saat ini: <b>${log.ket||'Hadir'}</b>. Gunakan ini apabila siswa masuk/pulang dalam keadaan Sakit, Ijin, Bolos, Emergency, dll.</p>
    <label style="display:flex;align-items:center;gap:8px;font-size:15px;color:var(--text-dim);margin-bottom:12px;cursor:pointer;">
      <input type="checkbox" id="waOptIn" ${state.sendWaNotif?'checked':''} style="width:15px;height:15px;accent-color:var(--gold);">
      Kirim notifikasi WhatsApp ke orang tua
    </label>
    <label style="display:block;font-size:15px;color:var(--text-dim);margin-bottom:8px;">Keterangan</label>
    <div class="ket-grid">
      ${MANUAL_KET_OPTIONS.map(k=>`<button class="ket-opt ${state.selectedKet===k?'active':''} ${k==='Lainnya'?'ket-opt-add':''}" data-ket="${k}">${ketOptionLabel(k)}</button>`).join('')}
    </div>
    ${state.selectedKet==='Lainnya' ? `<div class="field"><input id="lainnyaInput" placeholder="Tulis keterangan..." value="${escapeHtml(state.lainnyaNote)}" style="width:100%;background:var(--well);border:1px solid var(--line-strong);border-radius:7px;padding:7px 10px;color:var(--text);font-size:14.38px;"></div>` : ''}
    <button class="btn btn-gold btn-block" id="btnSaveKetAnnotation" style="margin-top:6px;">${state.sendWaNotif ? 'Simpan &amp; Siapkan Notifikasi WA' : 'Simpan Keterangan'}</button>
    <button class="btn btn-outline btn-block" id="btnBackKetTarget" style="margin-top:8px;">Kembali</button>
    `;
  }
}

function escapeHtml(str){
  return String(str??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// Ganti isi #sidePanel + ikat ulang event, tanpa render() penuh (agar kamera tidak terganggu).
function refreshSidePanel(){
  const sp = document.getElementById('sidePanel');
  if(sp){ sp.innerHTML = sidePanelContent(); bindSidePanelEvents(); }
}

function defaultKet(){
  if(state.petugasMode === 'manual') return MANUAL_KET_OPTIONS[0];
  if(state.petugasMode === 'tidakHadir') return TIDAK_HADIR_KET_OPTIONS[0];
  if(state.petugasMode === 'alpaKet') return ALPA_KET_OPTIONS[0];
  return 'Hadir';
}

function pickStudent(s){
  if(!s) return;
  state.selectedStudent = s; state.selectedKetTarget=null; state.lastResult=null;
  if(state.petugasMode === 'tidakHadir'){
    // Kalau siswa ini SUDAH punya catatan Tidak Hadir hari ini, tampilkan
    // keterangan yang tersimpan sebagai titik awal (supaya mudah diubah),
    // bukan selalu mulai dari pilihan pertama.
    const existing = todayTidakHadirFor(s.id);
    state.selectedKet = existing && TIDAK_HADIR_KET_OPTIONS.includes(existing.ket) ? existing.ket : TIDAK_HADIR_KET_OPTIONS[0];
    state.lainnyaNote = existing ? (existing.note || '') : '';
  }else if(state.petugasMode === 'alpaKet'){
    // Kalau catatan Masuk (Alpa) siswa ini sudah pernah diberi keterangan
    // sebelumnya (mis. petugas mengubahnya dua kali), tampilkan keterangan
    // terakhir sebagai titik awal — kalau belum pernah, mulai dari "Alpa"
    // (status siswa saat ini) supaya petugas hanya perlu mengubahnya kalau
    // memang ada alasan yang sudah jelas.
    const log = todayLogsFor(s.id).masuk;
    state.selectedKet = (log && ALPA_KET_OPTIONS.includes(log.ket)) ? log.ket : ALPA_KET_OPTIONS[0];
    state.lainnyaNote = (log && log.note) || '';
  }else{
    state.selectedKet = defaultKet();
    state.lainnyaNote = '';
  }
  refreshSidePanel();
}

function resetScanState(){
  state.selectedStudent=null; state.selectedKet=defaultKet(); state.selectedKetTarget=null; state.lainnyaNote=''; state.lastResult=null; state.searchQuery='';
}

function handleBack(){
  stopCamera();
  if(state.screen==='petugasScan'){ state.screen='petugasMode'; }
  else if(state.screen==='petugasMode'){ state.screen='landing'; }
  else if(state.screen==='admin'){ state.screen='landing'; }
  else if(state.screen==='adminLogin'){ state.screen='landing'; }
  else if(state.screen==='petugasLogin'){ state.screen='landing'; }
  else state.screen='landing';
  render();
}

async function submitPin(){
  const el = document.getElementById('pinInput');
  const errEl = document.getElementById('pinErr');
  const val = el.value.trim();
  const role = state.screen === 'petugasLogin' ? 'petugas' : 'admin';
  if(!val){ errEl.textContent = 'Masukkan PIN terlebih dahulu.'; return; }

  state.pinLoading = true;
  errEl.textContent = '';
  render();

  try{
    const res = await callApi({ action:'checkPin', role, pin:val });
    if(res.valid){
      if(role === 'admin'){ state.adminUnlocked = true; state.screen = 'admin'; }
      else{ state.petugasUnlocked = true; state.screen = 'petugasMode'; }
      state.pinLoading = false;
      render();
    }else{
      state.pinLoading = false;
      render();
      document.getElementById('pinErr').textContent = 'PIN salah, silakan coba lagi.';
    }
  }catch(err){
    state.pinLoading = false;
    render();
    const msg = err.message === 'SERVER_BELUM_DIKONFIGURASI'
      ? 'Server belum terhubung. Isi API_URL & API_KEY di kode aplikasi terlebih dahulu.'
      : 'Gagal menghubungi server, coba lagi.';
    document.getElementById('pinErr').textContent = msg;
  }
}

function normalizeNisn(n){ return String(n||'').trim(); }

function findStudentByNisn(nisn, list){
  const n = normalizeNisn(nisn);
  if(!n) return null;
  return (list || state.students).find(s => normalizeNisn(s.nisn) === n) || null;
}

async function addStudent(){
  const kelas = document.getElementById('fKelas').value.trim();
  const name = document.getElementById('fName').value.trim();
  const nisn = document.getElementById('fNisn').value.trim();
  const wa = document.getElementById('fWa').value.trim();
  if(!name || !kelas){ alert('Nama dan kelas wajib diisi.'); return; }
  if(nisn){
    const dup = findStudentByNisn(nisn);
    if(dup){ alert(`NISN ${nisn} sudah terdaftar atas nama ${dup.name} (${dup.kelas}). NISN harus unik.`); return; }
  }
  const student = { id:uid(), name, kelas, nisn, parentWA:wa, code:genCode() };

  const btn = document.getElementById('btnAddStudent');
  if(btn){ btn.disabled = true; btn.textContent = 'Menyimpan...'; }

  if(API_URL){
    try{
      await callApi({ action:'addStudent', student });
    }catch(err){
      alert('Gagal menyimpan ke server: ' + err.message);
      if(btn){ btn.disabled = false; btn.innerHTML = `${ICON.plus} Tambah &amp; Buat Kartu QR`; }
      return;
    }
  }

  state.students.push(student);
  if(!API_URL){ saveStudents(); }
  state.qrModalStudent = student;
  render();
}

/* ================= IMPOR MASSAL DARI SPREADSHEET ================= */
const IMPORT_HEADER_ALIASES = {
  name: ['nama','nama siswa','nama lengkap','nama lengkap siswa'],
  kelas: ['kelas','kls'],
  nisn: ['nisn','nisn siswa','no nisn'],
  parentWA: ['no wa orang tua','no whatsapp orang tua','nomor wa orang tua','wa orang tua','no wa','whatsapp','no hp orang tua','nomor whatsapp','no wa ortu','no. whatsapp orang tua']
};

function normalizeHeader(h){
  return String(h||'').toLowerCase().trim().replace(/[."'`]/g,'').replace(/\s+/g,' ');
}

function matchImportField(header){
  const h = normalizeHeader(header);
  for(const field in IMPORT_HEADER_ALIASES){
    if(IMPORT_HEADER_ALIASES[field].includes(h)) return field;
  }
  return null;
}

function downloadImportTemplate(){
  const header = ['Kelas','Nama','NISN','No WA Orang Tua'];
  const example = ['XI-2','Ahmad Fahri Ramadhan','0051234567','081234567890'];
  const csv = header.join(',') + '\n' + example.join(',') + '\n';
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'template_impor_siswa.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ================= [OPTIMASI LOADING] LAZY-LOAD PUSTAKA BERAT ================= */
// Memuat sebuah <script> eksternal secara dinamis HANYA saat benar-benar
// dibutuhkan (dipanggil pertama kali fitur Admin yang memakainya), bukan di
// setiap pembukaan aplikasi. Di-cache lewat _loadedScripts supaya pemanggilan
// berulang (mis. impor Excel dua kali) tidak memuat ulang pustaka yang sama.
const _loadedScripts = {};
function loadScriptOnce(url, globalCheck){
  // Kalau pustakanya sudah tersedia secara global (mis. sempat dimuat lewat
  // cara lain), anggap sudah siap tanpa perlu fetch apa pun lagi.
  if(globalCheck && globalCheck()) return Promise.resolve();
  if(_loadedScripts[url]) return _loadedScripts[url];
  _loadedScripts[url] = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = url;
    s.onload = () => resolve();
    s.onerror = () => { delete _loadedScripts[url]; reject(new Error('GAGAL_MUAT_PUSTAKA')); };
    document.head.appendChild(s);
  });
  return _loadedScripts[url];
}
function loadXLSX(){
  return loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', ()=> typeof XLSX !== 'undefined');
}
function loadJSZip(){
  return loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js', ()=> typeof JSZip !== 'undefined');
}

function handleImportFile(file){
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      // Pustaka XLSX baru dimuat DI SINI (sekali saja, di-cache untuk
      // pemakaian berikutnya) — bukan sejak aplikasi pertama dibuka.
      await loadXLSX();
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type:'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
      processImportRows(rows);
    }catch(err){
      alert('Gagal membaca file. Pastikan formatnya .xlsx, .xls, atau .csv sesuai template, dan koneksi internet aktif (pustaka impor perlu dimuat sekali).');
    }
  };
  reader.onerror = () => alert('Gagal membaca file.');
  reader.readAsArrayBuffer(file);
}

function processImportRows(rows){
  if(!rows || !rows.length){ alert('File kosong atau tidak terbaca.'); return; }

  const headerKeys = Object.keys(rows[0]);
  const fieldMap = {};
  headerKeys.forEach(h => { const f = matchImportField(h); if(f) fieldMap[h] = f; });

  const valid = [];
  const errors = [];
  const nisnSeenInFile = new Set(); // deteksi NISN dobel di dalam file yang sama
  rows.forEach((row, idx) => {
    const rec = {};
    for(const h in fieldMap){ rec[fieldMap[h]] = String(row[h] ?? '').trim(); }
    if(!rec.name || !rec.kelas){
      errors.push(`Baris ${idx+2}: nama atau kelas kosong, dilewati.`);
      return;
    }
    const nisn = normalizeNisn(rec.nisn);
    if(nisn){
      const dupExisting = findStudentByNisn(nisn);
      if(dupExisting){
        errors.push(`Baris ${idx+2}: NISN ${nisn} sudah terdaftar atas nama ${dupExisting.name}, dilewati.`);
        return;
      }
      if(nisnSeenInFile.has(nisn)){
        errors.push(`Baris ${idx+2}: NISN ${nisn} dobel di dalam file ini, dilewati.`);
        return;
      }
      nisnSeenInFile.add(nisn);
    }
    valid.push({
      id: uid(),
      name: rec.name,
      kelas: rec.kelas,
      nisn: rec.nisn || '',
      parentWA: rec.parentWA || '',
      code: genCode(),
    });
  });

  if(!Object.values(fieldMap).includes('name') || !Object.values(fieldMap).includes('kelas')){
    alert('Kolom "Nama" dan/atau "Kelas" tidak ditemukan di file. Gunakan template yang disediakan sebagai acuan nama kolom.');
    return;
  }

  state.importPreview = { valid, errors };
  render();
}

// Kecilkan & kompres foto sebelum disimpan/dikirim: kartu presensi hanya
// menampilkan foto di kotak kecil (~20x24mm), dan kalau tersambung server,
// foto disimpan sebagai teks base64 di sel Google Sheets yang punya batas
// ~50.000 karakter — jadi foto DIWAJIBKAN kecil, bukan sekadar opsional.
function resizeImageDataUrl(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w >= h){ if(w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else{ if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Gagal membaca gambar.'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('Gagal membaca file.'));
    reader.readAsDataURL(file);
  });
}

// Simpan foto siswa yang diunggah dari slot foto pada kartu presensi.
// Kalau aplikasi tersambung server (API_URL), foto dikirim & disimpan di
// Google Sheets lewat aksi "updatePhoto" (lihat Code.gs) supaya bisa
// tercetak dari komputer manapun. Kalau tidak tersambung server, foto
// disimpan di localStorage browser ini saja (lihat savePhotoLocal).
async function handlePhotoUpload(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ alert('File harus berupa gambar (JPG/PNG).'); return; }
  const student = state.qrModalStudent;
  const slot = document.getElementById('photoSlot');
  if(slot) slot.style.opacity = '0.5';
  try{
    const resized = await resizeImageDataUrl(file, 240, 0.72);
    if(API_URL){
      await callApi({ action:'updatePhoto', id: student.id, photo: resized });
    }
    const idx = state.students.findIndex(s=>s.id===student.id);
    if(idx>-1){
      state.students[idx].photo = resized;
      state.qrModalStudent = state.students[idx];
      if(!API_URL){ savePhotoLocal(student.id, resized); }
    }
    render();
  }catch(err){
    alert('Gagal menyimpan foto: ' + err.message + (API_URL ? '\n\nPastikan Code.gs di Apps Script sudah ditambahkan aksi "updatePhoto" dan dideploy ulang.' : ''));
    if(slot) slot.style.opacity = '1';
  }
}

/* ================= UNGGAH FOTO MASSAL (cocok otomatis dari nama file) ================= */
// Ratakan teks (nama siswa ATAU nama file) supaya bisa dibandingkan apa
// adanya: huruf kecil semua, garis bawah/strip dianggap spasi, tanda baca
// dibuang, spasi ganda dirapikan.
function normalizeMatchText(str){
  return String(str||'')
    .toLowerCase()
    .replace(/[_\-]+/g,' ')
    .replace(/[.,()]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

// Buang ekstensi file (.jpg, .jpeg, .png, dst) dari nama file.
function stripExt(filename){
  return String(filename||'').replace(/\.[a-z0-9]+$/i,'');
}

// Cocokkan satu nama file (tanpa ekstensi) ke salah satu siswa di `students`.
// Urutan pencocokan: (1) sama persis dengan nama siswa, (2) sama persis
// dengan NISN siswa, (3) jika tidak ada yang sama persis, coba cocok
// sebagian (mengandung) tapi HANYA dipakai kalau hasilnya tunggal/tidak
// ambigu, supaya tidak salah tempel ke siswa yang salah.
function matchStudentByFileName(rawName, students){
  const norm = normalizeMatchText(stripExt(rawName));
  if(!norm) return null;

  for(const s of students){ if(normalizeMatchText(s.name) === norm) return s; }
  for(const s of students){ if(s.nisn && normalizeMatchText(s.nisn) === norm) return s; }

  const contains = students.filter(s=>{
    const n = normalizeMatchText(s.name);
    return n && (norm.includes(n) || n.includes(norm));
  });
  if(contains.length === 1) return contains[0];

  return null;
}

// Proses banyak file foto sekaligus: setiap file dicocokkan ke siswa lewat
// namanya, lalu ditempelkan sebagai foto siswa tsb. Kalau tersambung server,
// tiap foto juga dikirim & disimpan di Google Sheets (aksi "updatePhoto")
// supaya bisa dipakai mencetak kartu dari komputer manapun. Di akhir,
// tampilkan ringkasan berapa yang berhasil, file yang tidak cocok namanya,
// dan (kalau ada) foto yang gagal dikirim ke server.
async function handleBulkPhotoUpload(fileList){
  const files = Array.from(fileList||[]).filter(f=>f.type.startsWith('image/'));
  if(!files.length){ alert('Tidak ada file gambar yang dipilih.'); return; }

  const btn = document.getElementById('btnPickBulkPhoto');
  if(btn){ btn.disabled = true; }

  let matched = 0;
  const unmatched = [];
  const serverFailed = [];

  for(let i=0;i<files.length;i++){
    const file = files[i];
    if(btn) btn.textContent = `Memproses ${i+1}/${files.length}...`;
    const student = matchStudentByFileName(file.name, state.students);
    if(!student){ unmatched.push(file.name); continue; }
    try{
      const resized = await resizeImageDataUrl(file, 240, 0.72);
      if(API_URL){
        try{
          await callApi({ action:'updatePhoto', id: student.id, photo: resized });
        }catch(err){
          serverFailed.push(file.name);
          continue; // jangan tandai "matched" kalau gagal tersimpan di server
        }
      }
      const idx = state.students.findIndex(s=>s.id===student.id);
      if(idx>-1){
        state.students[idx].photo = resized;
        if(!API_URL){ savePhotoLocal(student.id, resized); }
        matched++;
      }
    }catch(err){
      unmatched.push(file.name);
    }
    if(i % 5 === 4){ await new Promise(r=> setTimeout(r, 0)); }
  }

  if(!API_URL){ saveStudents(); }
  render();

  if(btn){ btn.disabled = false; btn.innerHTML = `${ICON.upload} Pilih Foto (Banyak Sekaligus)`; }

  let msg = `${matched} dari ${files.length} foto berhasil dicocokkan & dipasang ke data siswa.`;
  if(unmatched.length){
    msg += `\n\nFile berikut TIDAK ditemukan siswa yang cocok namanya (periksa ejaan nama file):\n- ${unmatched.join('\n- ')}`;
  }
  if(serverFailed.length){
    msg += `\n\nFile berikut GAGAL disimpan ke server (jaringan/Code.gs belum mendukung "updatePhoto"):\n- ${serverFailed.join('\n- ')}`;
  }
  alert(msg);
}

/* ================= RENDER KARTU SISWA LENGKAP (untuk unduhan) ================= */
// Menggambar seluruh tampilan kartu presensi (logo, foto, nama, kelas, kode,
// QR) ke satu kanvas beresolusi cetak (300dpi) seukuran fisik KTP potret
// (53.98mm x 85.6mm), supaya file yang diunduh adalah kartu utuh, bukan
// sekadar QR code polos. Dipakai baik untuk unduhan satuan maupun massal.
const CARD_DPI = 300;
const MM = CARD_DPI / 25.4;   // px kanvas per mm
const CPX = CARD_DPI / 96;    // px kanvas per 1 CSS px

function loadImage(src){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function roundRectPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

// Gambar `img` ke kotak (x,y,w,h) dengan perilaku object-fit:cover.
function drawImageCover(ctx, img, x, y, w, h){
  const ir = img.width / img.height, dr = w / h;
  let sx, sy, sw, sh;
  if(ir > dr){ sh = img.height; sw = sh * dr; sx = (img.width - sw)/2; sy = 0; }
  else { sw = img.width; sh = sw / dr; sx = 0; sy = (img.height - sh)/2; }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

async function renderCardCanvas(student){
  if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }

  const W = Math.round(53.98 * MM), H = Math.round(85.6 * MM);
  const pad = 3.2 * MM;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top'; // y selalu berarti "atas teks", supaya perhitungan tinggi baris konsisten & tidak salah hitung

  // latar belakang gradasi kartu
  const grad = ctx.createLinearGradient(0, 0, W*0.35, H);
  grad.addColorStop(0, '#0D3A5C');
  grad.addColorStop(1, '#061A2B');
  roundRectPath(ctx, 0, 0, W, H, 3*MM);
  ctx.fillStyle = grad; ctx.fill();
  ctx.lineWidth = 1*CPX;
  ctx.strokeStyle = '#0B4468';
  roundRectPath(ctx, ctx.lineWidth/2, ctx.lineWidth/2, W-ctx.lineWidth, H-ctx.lineWidth, 3*MM);
  ctx.stroke();

  let y = pad;

  // logo
  try{
    const logo = await loadImage(LOGO_DATA_URI);
    const logoSize = 14*MM;
    ctx.drawImage(logo, (W-logoSize)/2, y, logoSize, logoSize);
    y += logoSize + 0.8*MM;
  }catch(e){ y += 14*MM + 0.8*MM; }

  // nama sekolah (setara CSS font-size:5.8px)
  const schoolSize = 11.6*CPX;
  ctx.fillStyle = '#FFFFFF';
  ctx.font = `${schoolSize}px 'JetBrains Mono', monospace`;
  ctx.fillText('STUDENT ATTENDANCE CARD', W/2, y);
  y += schoolSize*1.25 + 1.8*MM;

  // slot foto — ukuran TETAP 25mm x 30mm, ditengahkan secara horizontal.
  // Nama siswa digambar TEPAT di bawahnya (rata tengah); kelas & kode
  // dipindah ke baris bawah kartu, di sebelah kiri kode QR.
  const photoW = 25*MM, photoH = 30*MM, photoX = (W-photoW)/2;
  if(student.photo){
    try{
      const photoImg = await loadImage(student.photo);
      ctx.save();
      roundRectPath(ctx, photoX, y, photoW, photoH, 1.6*MM);
      ctx.clip();
      drawImageCover(ctx, photoImg, photoX, y, photoW, photoH);
      ctx.restore();
    }catch(e){}
  }else{
    ctx.save();
    roundRectPath(ctx, photoX, y, photoW, photoH, 1.6*MM);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fill();
    ctx.setLineDash([4,3]);
    ctx.strokeStyle = 'rgba(175,203,219,0.55)';
    ctx.lineWidth = 1*CPX;
    ctx.stroke();
    ctx.setLineDash([]);
    const hintSize = 6*CPX;
    ctx.fillStyle = '#AFCBDB';
    ctx.font = `${hintSize}px 'Inter', sans-serif`;
    ctx.fillText('Foto', photoX+photoW/2, y+photoH/2-hintSize/2);
    ctx.restore();
  }
  y += photoH + 1.8*MM;

  // Nama siswa — TEPAT di bawah foto, rata tengah, maks 2 baris.
  ctx.textAlign = 'center';
  const nmSize = 10.55*CPX, nmLineHeight = nmSize*1.25;
  ctx.font = `700 ${nmSize}px 'Space Grotesk', sans-serif`;
  const nmLines = wrapTextLines(ctx, student.name, W-2*pad, 2);
  ctx.fillStyle = '#EAF4FA';
  nmLines.forEach((ln,i)=> ctx.fillText(ln, W/2, y + i*nmLineHeight));
  y += nmLines.length*nmLineHeight;

  // --- Geometri BARIS BAWAH: kelas & kode + kotak QR SEKARANG dipusatkan
  // sebagai SATU KELOMPOK (bukan lagi rata kiri-kanan penuh) — didorong ke
  // dasar kartu, memakai sisa ruang yang tidak terpakai oleh foto+nama di
  // atasnya (persis meniru margin-top:auto pada versi HTML/CSS).
  const qrSize = 16*MM, qrPad = 1*MM, qrBoxSize = qrSize + qrPad*2; // UKURAN QR TETAP SAMA seperti sebelumnya
  const rowGap = 3*MM;          // jarak blok teks ke kotak QR
  const rowMarginBottom = 3*MM; // jarak baris bawah ke tepi bawah kartu
  const rowH = qrBoxSize;       // tinggi baris mengikuti tinggi kotak QR (lebih tinggi dari blok teks)
  const rowTop = H - pad - rowMarginBottom - rowH;

  // Lebar blok teks (kelas/kode) = teks TERLEBAR di antara keduanya, supaya
  // seluruh kelompok (teks + jarak + kotak QR) bisa dipusatkan secara akurat.
  const clsSize = 7*CPX, clsLineHeight = clsSize*1.25;
  const codeSize = 6*CPX, codeLineHeight = codeSize*1.25;
  ctx.font = `${clsSize}px 'Inter', sans-serif`;
  const clsW = ctx.measureText(student.kelas).width;
  ctx.font = `${codeSize}px 'JetBrains Mono', monospace`;
  const codeW = ctx.measureText(student.code).width;
  const textBlockW = Math.max(clsW, codeW);

  const groupW = textBlockW + rowGap + qrBoxSize;
  const groupX = (W - groupW) / 2; // pusatkan seluruh kelompok secara horizontal
  const textX = groupX, qrX = groupX + textBlockW + rowGap, qrY = rowTop;

  // --- Blok teks (kelas, kode) — RATA KIRI di dalam kelompoknya sendiri,
  // divertikal-tengahkan terhadap tinggi kotak QR di sisi kanannya.
  ctx.textAlign = 'left';
  const textBlockH = clsLineHeight + 1.2*MM + codeLineHeight;
  let ty = rowTop + (rowH - textBlockH)/2;

  ctx.fillStyle = '#AFCBDB';
  ctx.font = `${clsSize}px 'Inter', sans-serif`;
  ctx.fillText(student.kelas, textX, ty);
  ty += clsLineHeight + 1.2*MM;

  ctx.fillStyle = 'rgba(225,230,240,0.6)';
  ctx.font = `${codeSize}px 'JetBrains Mono', monospace`;
  ctx.fillText(student.code, textX, ty);
  ctx.textAlign = 'center';

  // QR code — UKURAN SAMA seperti sebelumnya (16mm), sekarang di kanan kelompok yang dipusatkan
  ctx.fillStyle = '#ffffff';
  roundRectPath(ctx, qrX, qrY, qrBoxSize, qrBoxSize, 1.2*MM);
  ctx.fill();
  const qrDataUrl = generateQrDataUrl(student.code, 400);
  if(qrDataUrl){
    try{
      const qrImg = await loadImage(qrDataUrl);
      ctx.drawImage(qrImg, qrX+qrPad, qrY+qrPad, qrSize, qrSize);
    }catch(e){}
  }

  return canvas;
}

// Bungkus teks ke maksimal `maxLines` baris supaya tidak meluber dari lebar
// yang tersedia — HANYA menghitung & mengembalikan baris-barisnya (tidak
// langsung menggambar), supaya pemanggil bisa tahu dulu tinggi total blok
// teks SEBELUM menggambar (dibutuhkan untuk menengahkan blok teks secara
// vertikal terhadap tinggi kotak QR di sebelahnya).
function wrapTextLines(ctx, text, maxWidth, maxLines){
  const words = String(text||'').split(' ');
  const lines = [];
  let line = '';
  for(const w of words){
    const test = line ? line+' '+w : w;
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w; }
    else line = test;
  }
  if(line) lines.push(line);
  return lines.slice(0, maxLines || lines.length);
}

// Unduh satu kartu siswa (dari modal QR) sebagai gambar PNG lengkap.
// Memakai Blob + object URL (bukan data URI langsung) dan anchor yang
// sungguh-sungguh dipasang ke halaman sebelum diklik, supaya unduhan
// tetap berjalan konsisten di berbagai browser.
async function downloadQr(){
  const btn = document.getElementById('btnDownloadQr');
  if(btn){ btn.disabled = true; btn.textContent = 'Menyiapkan...'; }
  try{
    const canvas = await renderCardCanvas(state.qrModalStudent);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    if(!blob){ alert('Gagal membuat gambar kartu. Coba lagi.'); return; }
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = `kartu-presensi-${sanitizeFileName(state.qrModalStudent.name)}-${state.qrModalStudent.code}.png`;
    link.href = url;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(()=> URL.revokeObjectURL(url), 4000);
  }catch(err){
    console.error(err);
    alert('Gagal menyiapkan kartu untuk diunduh: ' + err.message);
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = 'Unduh Kartu Presensi'; }
  }
}

/* ================= UNDUH KARTU SISWA MASSAL (ZIP) ================= */
// Bersihkan nama file dari karakter yang tidak valid di sistem berkas.
function sanitizeFileName(str){
  return String(str||'').trim().replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,'_') || 'siswa';
}

// Render satu kode QR ke kanvas tersembunyi (di luar layar) lalu ambil data
// gambarnya sebagai data URL PNG. Dipakai berulang untuk unduhan massal
// tanpa menampilkan kanvas sementara ini ke pengguna.
function generateQrDataUrl(text, size){
  const holder = document.createElement('div');
  holder.style.position = 'absolute';
  holder.style.left = '-9999px';
  holder.style.top = '-9999px';
  document.body.appendChild(holder);
  new QRCode(holder, { text, width: size||300, height: size||300, colorDark:'#0A2540', colorLight:'#ffffff' });
  const canvas = holder.querySelector('canvas');
  const dataUrl = canvas ? canvas.toDataURL('image/png') : null;
  document.body.removeChild(holder);
  return dataUrl;
}

// Buat & unduh satu file ZIP berisi kartu siswa lengkap (PNG, dengan logo,
// foto, nama, kelas, dan QR) untuk setiap siswa di dalam `list`. Dipakai
// tombol "Unduh Kartu Presensi (ZIP)" di panel Admin.
async function downloadAllQr(list){
  if(!list || !list.length){
    alert('Tidak ada siswa pada pilihan ini untuk diunduh kartunya.');
    return;
  }
  const btn = document.getElementById('btnDownloadAllQr');
  if(btn){ btn.disabled = true; btn.textContent = 'Menyiapkan pustaka ZIP...'; }
  try{
    // Pustaka JSZip baru dimuat DI SINI (sekali saja, di-cache) — bukan
    // sejak aplikasi pertama dibuka — lihat loadJSZip()/loadScriptOnce().
    await loadJSZip();
  }catch(e){
    alert('Gagal memuat pustaka ZIP. Periksa koneksi internet lalu coba lagi.');
    if(btn){ btn.disabled = false; btn.innerHTML = `${ICON.download} Unduh Kartu Presensi (ZIP)`; }
    return;
  }

  const zip = new JSZip();
  const usedNames = {};
  let failCount = 0;
  for(let i=0;i<list.length;i++){
    const s = list[i];
    if(btn) btn.textContent = `Menyiapkan ${i+1}/${list.length}...`;
    try{
      const canvas = await renderCardCanvas(s);
      const dataUrl = canvas.toDataURL('image/png');
      const base64 = dataUrl.split(',')[1];
      let fname = `${sanitizeFileName(s.kelas)}_${sanitizeFileName(s.name)}_${s.code}.png`;
      if(usedNames[fname]){
        usedNames[fname]++;
        fname = fname.replace(/\.png$/, `_${usedNames[fname]}.png`);
      }else{
        usedNames[fname] = 1;
      }
      zip.file(fname, base64, { base64:true });
    }catch(err){
      console.error('Gagal membuat kartu untuk', s.name, err);
      failCount++;
    }
    // beri jeda singkat tiap 10 kartu supaya antarmuka tetap responsif
    // (renderCardCanvas lebih berat daripada QR polos karena memuat gambar)
    if(i % 10 === 9){ await new Promise(r=> setTimeout(r, 0)); }
  }
  if(failCount === list.length){
    alert('Gagal membuat kartu siswa. Coba lagi.');
    if(btn){ btn.disabled = false; btn.innerHTML = `${ICON.download} Unduh Kartu Presensi (ZIP)`; }
    return;
  }

  if(btn) btn.textContent = 'Membuat file ZIP...';
  const blob = await zip.generateAsync({ type:'blob' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const scopeLabel = (list.length === state.students.length) ? 'semua-siswa' : sanitizeFileName(list[0].kelas);
  a.download = `kartu-presensi-${scopeLabel}.zip`;
  a.href = url;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);

  if(btn){ btn.disabled = false; btn.innerHTML = `${ICON.download} Unduh Kartu Presensi (ZIP)`; }
}

/* ================= UNDUH KODE QR POLOS (satuan & massal) ================= */
// Berbeda dari downloadQr()/downloadAllQr() di atas: fungsi-fungsi ini
// TIDAK menggambar kartu presensi lengkap (logo, foto, nama, kelas),
// hanya kotak kode QR itu sendiri sebagai PNG.

// Unduh SATU kode QR polos milik seorang siswa. Dipakai oleh tombol
// unduh per-baris pada tab "Unduh Kode QR" di panel Admin.
function downloadSingleQrOnly(student){
  const dataUrl = generateQrDataUrl(student.code, 600);
  if(!dataUrl){ alert('Gagal membuat kode QR. Coba lagi.'); return; }
  const link = document.createElement('a');
  link.download = `qr-${sanitizeFileName(student.name)}-${student.code}.png`;
  link.href = dataUrl;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// Buat & unduh satu file ZIP berisi kode QR POLOS (bukan kartu presensi
// lengkap) untuk setiap siswa di dalam `list`. Dipakai tombol
// "Unduh Kode QR (ZIP)" pada tab "Unduh Kode QR" di panel Admin.
async function downloadAllQrOnly(list){
  if(!list || !list.length){
    alert('Tidak ada siswa pada pilihan ini untuk diunduh kode QR-nya.');
    return;
  }
  const btn = document.getElementById('btnDownloadAllQrOnly');
  if(btn){ btn.disabled = true; btn.textContent = 'Menyiapkan pustaka ZIP...'; }
  try{
    await loadJSZip();
  }catch(e){
    alert('Gagal memuat pustaka ZIP. Periksa koneksi internet lalu coba lagi.');
    if(btn){ btn.disabled = false; btn.innerHTML = `${ICON.download} Unduh Kode QR (ZIP)`; }
    return;
  }

  const zip = new JSZip();
  const usedNames = {};
  let failCount = 0;
  for(let i=0;i<list.length;i++){
    const s = list[i];
    if(btn) btn.textContent = `Menyiapkan ${i+1}/${list.length}...`;
    try{
      const dataUrl = generateQrDataUrl(s.code, 600);
      if(!dataUrl) throw new Error('Kode QR kosong');
      const base64 = dataUrl.split(',')[1];
      let fname = `${sanitizeFileName(s.kelas)}_${sanitizeFileName(s.name)}_${s.code}.png`;
      if(usedNames[fname]){
        usedNames[fname]++;
        fname = fname.replace(/\.png$/, `_${usedNames[fname]}.png`);
      }else{
        usedNames[fname] = 1;
      }
      zip.file(fname, base64, { base64:true });
    }catch(err){
      console.error('Gagal membuat kode QR untuk', s.name, err);
      failCount++;
    }
    // beri jeda singkat tiap 20 kode supaya antarmuka tetap responsif
    if(i % 20 === 19){ await new Promise(r=> setTimeout(r, 0)); }
  }
  if(failCount === list.length){
    alert('Gagal membuat kode QR siswa. Coba lagi.');
    if(btn){ btn.disabled = false; btn.innerHTML = `${ICON.download} Unduh Kode QR (ZIP)`; }
    return;
  }

  if(btn) btn.textContent = 'Membuat file ZIP...';
  const blob = await zip.generateAsync({ type:'blob' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const scopeLabel = (list.length === state.students.length) ? 'semua-siswa' : sanitizeFileName(list[0].kelas);
  a.download = `kode-qr-${scopeLabel}.zip`;
  a.href = url;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);

  if(btn){ btn.disabled = false; btn.innerHTML = `${ICON.download} Unduh Kode QR (ZIP)`; }
}

// Menyimpan catatan Masuk/Pulang — dipakai untuk SEMUA jalur pencatatan biasa:
// siswa dipilih manual saat mode Pemindai Masuk/Pulang, maupun lewat Input Manual
// Masuk/Pulang. TIDAK ada keterangan (Hadir/Sakit/dll) yang disertakan di sini —
// keterangan hanya bisa ditambahkan belakangan lewat mode "Input Manual (Keterangan)".
// Kekecualian: type==='alpa' (siswa TIDAK MASUK sekolah) — dicatat langsung dengan
// keterangan "Alpa" pada slot Masuk hari itu (karena siswa memang tidak hadir sama
// sekali, jadi tidak ada catatan Masuk terlebih dahulu untuk ditambahkan keterangan).
async function confirmManualAttendance(type){
  const s = state.selectedStudent;
  if(!s) return;
  ensureAudio(); // dipanggil di dalam gestur klik tombol agar audio diizinkan browser
  // Cek cepat berbasis cache LOKAL dulu untuk kasus yang jelas-jelas duplikat
  // di PERANGKAT INI. Keputusan yang benar-benar final (termasuk mendeteksi
  // pemindaian dari PERANGKAT LAIN) tetap ditentukan oleh server di bawah.
  const localDup = todayLogsFor(s.id)[type];
  if(localDup){
    playRejectBeep();
    const label = type==='masuk' ? 'MASUK' : 'PULANG';
    showToast(`Pemindaian ditolak — ${s.name} sudah tercatat ${label} hari ini pukul ${timeOnly(localDup.timestamp)}.`, 'warn');
    return;
  }
  const sendWa = state.sendWaNotif;
  const log = { id:uid(), studentId:s.id, type, ket:'', note:'', timestamp:Date.now() };

  // Nonaktifkan tombol sementara menunggu konfirmasi server — mencegah klik
  // ganda yang bisa memicu dua permintaan untuk catatan yang sama.
  const btn = document.getElementById('btnQuickManualConfirm');
  if(btn){ btn.disabled = true; btn.dataset.origText = btn.textContent; btn.textContent = 'Memeriksa...'; }

  // Kirim & TUNGGU konfirmasi SERVER sebelum benar-benar dianggap berhasil —
  // inilah yang mencegah dua perangkat berbeda sama-sama berhasil mencatat
  // siswa yang sama pada hari yang sama.
  const result = await saveLogEntry(log);
  const label = type==='masuk' ? 'MASUK' : 'PULANG';

  if(result.duplicate){
    if(result.existing && !state.logs.some(l=>l.id===result.existing.id)){
      state.logs.push(result.existing);
    }
    playRejectBeep();
    const waktu = result.existing ? ` pukul ${timeOnly(result.existing.timestamp)}` : '';
    showToast(`Pemindaian ditolak — ${s.name} sudah tercatat ${label} hari ini${waktu} (di perangkat lain).`, 'warn');
    if(btn){ btn.disabled = false; btn.textContent = btn.dataset.origText || btn.textContent; }
    return;
  }

  // Siswa ini SUDAH tercatat "Tidak Hadir" (Sakit/Ijin/Emergency/Lainnya —
  // termasuk keterangan tulisan bebas) hari ini — TIDAK BOLEH lagi
  // tercatat Masuk/Pulang di hari yang sama. Ditolak oleh server (lihat
  // addLog_ di Code.gs), berlaku LINTAS PERANGKAT.
  if(result.blockedByTidakHadir){
    playRejectBeep();
    const ketTerdaftar = (result.existing && result.existing.ket) ? result.existing.ket : 'Tidak Hadir';
    showToast(`Pemindaian ditolak — ${s.name} sudah tercatat TIDAK HADIR (${ketTerdaftar}) hari ini, sehingga tidak bisa dicatat ${label}.`, 'warn');
    if(btn){ btn.disabled = false; btn.textContent = btn.dataset.origText || btn.textContent; }
    return;
  }

  playScanBeep();
  state.logs.push(log);
  state.lastResult = { student:s, ket:'', sendWa, type };
  showToast(`✓ BERHASIL — ${s.name}${s.kelas ? ' (' + s.kelas + ')' : ''} tercatat ${type==='masuk' ? 'MASUK' : (type==='pulang' ? 'PULANG' : String(type).toUpperCase())} pukul ${timeOnly(log.timestamp)}`, 'ok');
  const sp = document.getElementById('sidePanel'); if(sp) sp.innerHTML = sidePanelContent();
}

// Mode "Input Sakit/Ijin/Emergency" — menyimpan catatan TIDAK HADIR (bukan Masuk
// atau Pulang) untuk siswa yang HARI INI belum discan/diinput sama sekali,
// lengkap dengan alasannya (Sakit/Ijin/Emergency/ketik sendiri). Kalau siswa ini
// sudah punya catatan Tidak Hadir hari ini, keterangannya DIPERBARUI (bukan
// dobel) — supaya operator bisa mengoreksi kalau salah pilih sebelumnya.
async function confirmTidakHadir(){
  const s = state.selectedStudent;
  if(!s) return;
  ensureAudio(); // dipanggil di dalam gestur klik tombol agar audio diizinkan browser

  // Jaga-jaga: kalau di antara siswa dipilih & tombol ditekan ternyata siswa
  // ini sudah tercatat Masuk (mis. discan operator lain), batalkan — mode ini
  // memang khusus untuk siswa yang benar-benar belum hadir sama sekali.
  const already = todayLogsFor(s.id).masuk;
  if(already){
    showToast(`Dibatalkan — ${s.name} sudah tercatat MASUK hari ini pukul ${timeOnly(already.timestamp)}. Gunakan Input Keterangan.`, 'warn');
    refreshSidePanel();
    return;
  }

  const sendWa = state.sendWaNotif;
  const ket = state.selectedKet;
  const note = ket==='Lainnya' ? state.lainnyaNote : '';
  const existing = todayTidakHadirFor(s.id);

  const btn = document.getElementById('btnConfirmTidakHadir');
  if(btn){ btn.disabled = true; btn.dataset.origText = btn.textContent; btn.textContent = 'Menyimpan...'; }

  if(existing){
    existing.ket = ket; existing.note = note;
    await updateLogEntry(existing);
    playScanBeep();
    state.lastResult = { student:s, ket, sendWa, type:'tidakHadir', updated:true };
  }else{
    const log = { id:uid(), studentId:s.id, type:'tidakHadir', ket, note, timestamp:Date.now() };
    const result = await saveLogEntry(log);
    if(result.duplicate){
      if(result.existing && !state.logs.some(l=>l.id===result.existing.id)){
        state.logs.push(result.existing);
      }
      playRejectBeep();
      showToast(`Ditolak — ${s.name} sudah memiliki catatan hari ini (di perangkat lain).`, 'warn');
      if(btn){ btn.disabled = false; btn.textContent = btn.dataset.origText || btn.textContent; }
      return;
    }
    playScanBeep();
    state.logs.push(log);
    state.lastResult = { student:s, ket, sendWa, type:'tidakHadir' };
  }
  refreshSidePanel();
}
